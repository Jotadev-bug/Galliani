# Tests and deterministic evals on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest  # the platform the desktop app ships on
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,desktop,build,tui]"
      - name: Tests
        env:
          GALLIANI_REQUIRE_TUI: "1"  # TUI tests fail instead of skipping when Textual is missing (spec 017)
        run: python -m pytest -q
      - name: Evals
        run: python -m galliani.evaluation evals/cases

  # Builds the sdist and the wheel and installs the wheel into clean venvs; no secrets, no task, no provider call
  # (spec 016 R34, R35). Runs in parallel with `test`.
  wheel:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build
        run: python -m pip install build
      - name: Check the wheel
        run: python -m scripts.check_wheel
