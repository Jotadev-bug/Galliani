# Push a tag like v0.2.0 to build Galliani.exe, smoke-test it, and publish it on GitHub Releases.
# It can also be started by hand (Actions > Release > Run workflow) for a tag that already exists (spec 016 R1).
# The tag must match the version in pyproject.toml. Tags with a suffix (v0.2.0-beta.1) publish as pre-releases,
# which never become "latest", so /releases/latest/download/Galliani.exe is always the newest stable build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write  # create the release and upload its files

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}  # passed through env, never interpolated into scripts
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # all tags, so the check can read pyproject.toml at the tag
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Fails before building, naming the tag and the version, if the tag is malformed, missing or mismatched.
      - name: Check the tag matches pyproject.toml
        id: tag
        run: python -m scripts.release_tag "$env:TAG"

      - name: Check out the tag
        if: github.event_name == 'workflow_dispatch'
        run: git checkout --detach "refs/tags/$env:TAG"

      - name: Install
        run: python -m pip install -e ".[dev,desktop,build,tui]"
      - name: Tests
        run: python -m pytest -q

      # Builds the sdist and wheel, installs the wheel into clean venvs and copies the checked files to pkg/.
      # A failure stops the release, like a failed smoke test (spec 016 R38). Nothing is published to PyPI.
      - name: Check the wheel
        run: python -m scripts.check_wheel --dist-dir pkg

      # Builds dist/Galliani.exe and runs its --smoke-test; a failed smoke test fails the job.
      - name: Build and smoke-test
        run: python -m scripts.build_desktop

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Galliani.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Galliani.exe" | Out-File -Encoding ascii dist/Galliani.exe.sha256
          Get-Content dist/Galliani.exe.sha256
          foreach ($file in Get-ChildItem pkg/* -Include *.whl, *.tar.gz) {
            $h = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($file.Name)" | Out-File -Encoding ascii "$($file.FullName).sha256"
          }
          Get-ChildItem pkg

      # The manifest zip lets the maintainer submit to winget-pkgs without editing by hand (spec 016 R16).
      - name: Winget manifest
        run: python -m scripts.winget_manifest --tag "$env:TAG" --exe dist/Galliani.exe --zip-dir dist

      # Optional and unused: there is no Store release (Decision 0033). It is skipped while packaging/msix/identity.json
      # is empty, and a failure here never blocks the .exe release (continue-on-error). Kept until the user decides.
      - name: MSIX (optional, unused; skipped without identity.json)
        continue-on-error: true
        run: python -m scripts.build_msix --if-configured

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/Galliani.exe
            dist/Galliani.exe.sha256
            dist/galliani-winget-*.zip
            dist/Galliani.msix
            pkg/*.whl
            pkg/*.tar.gz
            pkg/*.sha256
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          body: |
            **Download:** `Galliani.exe` (Windows 10/11). You need your own [OpenRouter](https://openrouter.ai/keys) key. It is stored in your OS credential store and never leaves your device.

            **First launch:** this build is not code-signed yet, so Windows SmartScreen will warn "Windows protected your PC" and name the publisher as "Unknown publisher". That means Windows does not recognize the publisher, not that a problem was found in the file. To continue, click **More info**, then **Run anyway**. Please do not turn off SmartScreen or your antivirus. A code-signing certificate is planned, which should reduce or remove this warning over time, but it is not available for this release.

            **Check the download:** the SHA-256 of `Galliani.exe` is in the attached `Galliani.exe.sha256` file. Compare it with:

            ```powershell
            (Get-FileHash Galliani.exe -Algorithm SHA256).Hash
            ```

            **Install the terminal or the Python package without git (pipx):** this installs the wheel attached to this release, not a package from PyPI.

            ```powershell
            pipx install "galliani[tui] @ https://github.com/Jotadev-bug/Galliani/releases/download/${{ env.TAG }}/galliani-${{ steps.tag.outputs.version }}-py3-none-any.whl"
            ```

            Galliani is free software under the GNU AGPL-3.0. The source code for this release is attached below.
