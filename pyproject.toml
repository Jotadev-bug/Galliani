[project]
name = "galliani"
version = "0.2.0"
description = "Routes each prompt to the cheapest model that is sufficiently capable of solving it."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
desktop = ["pywebview>=6.2,<7", "keyring>=25.0"]
build = ["pyinstaller>=6.0", "pillow>=10.0"]
tui = ["textual>=8.2.8,<9"]

[project.scripts]
galliani = "galliani.tui.entry:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "benchmarks*", "galliani*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
