# Routing-only cases: realistic requests a user would type, with no answer checking.
# Used by benchmarks/routing_eval.py together with tasks.yaml.
#
#   min_tier   cheapest tier expected to handle the request reliably (author judgment):
#              cheap    = Gemini Flash-Lite
#              mid      = Claude Haiku, GPT-5.4 mini, Gemini Flash
#              strong   = Claude Sonnet
#              frontier = Claude Opus, Claude Fable
#
# A pick is "correct" at min_tier or one tier above, "underpowered" below it and
# "overspend" two or more tiers above. Edit freely: these labels are opinions.

- id: user-01
  min_tier: cheap
  prompt: "hola, ¿qué tal estás?"

- id: user-02
  min_tier: cheap
  prompt: "What's the capital of Canada?"

