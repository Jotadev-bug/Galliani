- id: user-13
  min_tier: strong
  prompt: "Build me a complete app from 0 and from your own idea."

- id: user-14
  min_tier: strong
  prompt: |
    My React component re-renders forever and the browser freezes. Find the bug and fix it.

    ```jsx
    function Profile({ userId }) {
      const [user, setUser] = useState(null);
      const options = { headers: { Authorization: token } };
      useEffect(() => {
        fetch(`/api/users/${userId}`, options).then(r => r.json()).then(setUser);
      }, [userId, options]);
      return <div>{user?.name}</div>;
    }
    ```

- id: user-15
  min_tier: strong
  prompt: "Design the database schema and REST API for a multi-tenant SaaS invoicing system with recurring billing, taxes per country and audit logs."

- id: user-16
  min_tier: strong
  prompt: "Review this business plan idea: an AI router that picks the cheapest capable model for each prompt and charges a margin on inference. What are the biggest risks and how would you validate it in 30 days?"

- id: user-17
  min_tier: strong
  prompt: "Write a Go worker pool that processes jobs from a channel with a configurable number of workers, graceful shutdown on context cancellation, and per-job timeouts. Include tests."

- id: user-18
  min_tier: frontier
  prompt: "Let p be an odd prime. Prove that the sum of the quadratic residues modulo p in {1, ..., p-1} is divisible by p when p > 3, and determine exactly when it is."

- id: user-19
  min_tier: frontier
  prompt: "Design a globally distributed, strongly consistent rate limiter handling 5 million requests per second across 12 regions with a p99 added latency under 5 ms. Explain the consensus approach, failure modes and how you would prove correctness."

- id: user-20
  min_tier: frontier
  prompt: "Find the subtle race condition: two goroutines append to a shared slice guarded by a sync.RWMutex, but readers call len() and then index into the slice under RLock while the writer may reallocate it. Explain precisely which interleavings corrupt data, and give a lock-free alternative with a correctness argument."
