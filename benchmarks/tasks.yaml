- id: code-07
  category: coding
  difficulty: 0.55
  prompt: "Write a Python function longest_valid_parentheses(s: str) -> int returning the length of the longest well-formed (balanced, contiguous) parentheses substring of s, which contains only '(' and ')'. Must run in O(n). Return only the code in a ```python block."
  checks:
    - type: python
      tests: |
        assert longest_valid_parentheses("(()") == 2
        assert longest_valid_parentheses(")()())") == 4
        assert longest_valid_parentheses("") == 0
        assert longest_valid_parentheses("()(())") == 6
        assert longest_valid_parentheses("())(())") == 4
        import time; t = time.time(); longest_valid_parentheses("()" * 200000 + ")"); assert time.time() - t < 2
  reference: |
    ```python
    def longest_valid_parentheses(s: str) -> int:
        stack, best = [-1], 0
        for i, c in enumerate(s):
            if c == "(":
                stack.append(i)
            else:
                stack.pop()
                if not stack:
                    stack.append(i)
                else:
                    best = max(best, i - stack[-1])
        return best
    ```

