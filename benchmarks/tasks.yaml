- id: dbg-05
  category: debugging
  difficulty: 0.5
  prompt: |
    parse_duration("1h30m") should return 5400 (seconds) and accept any combination of h, m and s in that order, e.g. "45s", "2h", "1m5s". It currently fails for several inputs. Return only the fixed function in a ```python block.

    ```python
    import re

    def parse_duration(text):
        m = re.match(r"(\d+)h(\d+)m(\d+)s", text)
        h, mi, s = m.groups()
        return int(h) * 3600 + int(mi) * 60 + int(s)
    ```
  checks:
    - type: python
      tests: |
        assert parse_duration("1h30m") == 5400
        assert parse_duration("45s") == 45
        assert parse_duration("2h") == 7200
        assert parse_duration("1m5s") == 65
        assert parse_duration("1h2m3s") == 3723
        try:
            parse_duration("abc")
            raise SystemExit(1)
        except ValueError:
            pass
  reference: |
    ```python
    import re

    def parse_duration(text):
        m = re.fullmatch(r"(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?", text.strip())
        if not m or not text.strip():
            raise ValueError(f"invalid duration: {text!r}")
        h, mi, s = (int(g) if g else 0 for g in m.groups())
        return h * 3600 + mi * 60 + s
    ```

