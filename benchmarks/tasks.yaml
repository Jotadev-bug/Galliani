# --------------------------------------------------------------------------- coding
- id: code-01
  category: coding
  difficulty: 0.15
  prompt: "Write a Python function is_palindrome(s: str) -> bool that returns True if s reads the same backwards, ignoring case, spaces and punctuation. Return only the code in a ```python block."
  checks:
    - type: python
      tests: |
        assert is_palindrome("A man, a plan, a canal: Panama")
        assert is_palindrome("")
        assert not is_palindrome("hello")
        assert is_palindrome("No 'x' in Nixon")
  reference: |
    ```python
    def is_palindrome(s: str) -> bool:
        t = [c.lower() for c in s if c.isalnum()]
        return t == t[::-1]
    ```

- id: code-02
  category: coding
  difficulty: 0.25
  prompt: "Write a Python function roman_to_int(s: str) -> int that converts a valid Roman numeral (1-3999) to an integer. Return only the code in a ```python block."
  checks:
    - type: python
      tests: |
        assert roman_to_int("III") == 3
        assert roman_to_int("LVIII") == 58
        assert roman_to_int("MCMXCIV") == 1994
        assert roman_to_int("MMMCMXCIX") == 3999
  reference: |
    ```python
    def roman_to_int(s: str) -> int:
        v = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
        total = 0
        for i, c in enumerate(s):
            if i + 1 < len(s) and v[c] < v[s[i + 1]]:
                total -= v[c]
            else:
                total += v[c]
        return total
    ```

- id: code-03
  category: coding
  difficulty: 0.35
  prompt: "Write a Python function merge_intervals(intervals: list[list[int]]) -> list[list[int]] that merges overlapping (or touching) closed intervals and returns them sorted by start. The input may be unsorted. Return only the code in a ```python block."
  checks:
    - type: python
      tests: |
        assert merge_intervals([[1,3],[2,6],[8,10],[15,18]]) == [[1,6],[8,10],[15,18]]
        assert merge_intervals([[1,4],[4,5]]) == [[1,5]]
        assert merge_intervals([[5,7],[1,2]]) == [[1,2],[5,7]]
        assert merge_intervals([]) == []
        assert merge_intervals([[1,10],[2,3]]) == [[1,10]]
  reference: |
    ```python
    def merge_intervals(intervals):
        out = []
        for s, e in sorted(intervals):
            if out and s <= out[-1][1]:
                out[-1][1] = max(out[-1][1], e)
            else:
                out.append([s, e])
        return out
    ```

- id: code-04
  category: coding
  difficulty: 0.45
  prompt: "Implement a Python class LRUCache(capacity: int) with methods get(key) -> value or -1 if missing, and put(key, value), both O(1). When capacity is exceeded, evict the least recently used key; get() counts as a use. Return only the code in a ```python block."
  checks:
    - type: python
      tests: |
        c = LRUCache(2)
        c.put(1, 1); c.put(2, 2)
        assert c.get(1) == 1
        c.put(3, 3)
        assert c.get(2) == -1
        c.put(4, 4)
        assert c.get(1) == -1
        assert c.get(3) == 3 and c.get(4) == 4
        c.put(3, 30)
        c.put(5, 5)
        assert c.get(4) == -1 and c.get(3) == 30
  reference: |
    ```python
    from collections import OrderedDict

    class LRUCache:
        def __init__(self, capacity):
            self.cap = capacity
            self.d = OrderedDict()

        def get(self, key):
            if key not in self.d:
                return -1
            self.d.move_to_end(key)
            return self.d[key]

        def put(self, key, value):
            self.d[key] = value
            self.d.move_to_end(key)
            if len(self.d) > self.cap:
                self.d.popitem(last=False)
    ```

- id: code-05
  category: coding
  difficulty: 0.65
  prompt: "Write a Python function eval_expr(s: str) -> float that evaluates an arithmetic expression with integers, + - * /, parentheses, unary minus and arbitrary whitespace, respecting precedence. Do not use eval, exec or ast. Return only the code in a ```python block."
  checks:
    - type: python
      tests: |
        import math
        src = open(__file__).read().split("# --- tests ---")[0]
        assert "eval(" not in src.replace("eval_expr(", "") and "import ast" not in src
        assert math.isclose(eval_expr("1 + 2 * 3"), 7)
        assert math.isclose(eval_expr("(1 + 2) * 3"), 9)
        assert math.isclose(eval_expr("-3 + 5"), 2)
        assert math.isclose(eval_expr("2 * -(3 - 5)"), 4)
        assert math.isclose(eval_expr(" 10 / 4 "), 2.5)
        assert math.isclose(eval_expr("2 - 3 - 4"), -5)
        assert math.isclose(eval_expr("--2"), 2)
  reference: |
    ```python
    def eval_expr(s: str) -> float:
        toks = [c for c in s if not c.isspace()]
        pos = 0

        def peek():
            return toks[pos] if pos < len(toks) else None

        def take():
            nonlocal pos
            pos += 1
            return toks[pos - 1]

        def expr():
            v = term()
            while peek() in ("+", "-"):
                v = v + term() if take() == "+" else v - term()
            return v

        def term():
            v = factor()
            while peek() in ("*", "/"):
                v = v * factor() if take() == "*" else v / factor()
            return v

        def factor():
            if peek() == "-":
                take()
                return -factor()
            if peek() == "(":
                take()
                v = expr()
                take()
                return v
            start = pos
            while peek() is not None and peek().isdigit():
                take()
            return float("".join(toks[start:pos]))

        return expr()
    ```

