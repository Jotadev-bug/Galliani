# --------------------------------------------------------------------------- summarization
- id: sum-01
  category: summarization
  difficulty: 0.2
  prompt: |
    Summarize the following in ONE sentence of at most 35 words.

    Northwind Traders reported third-quarter revenue of $4.2 million, up 12% from a year earlier,
    driven mainly by its new online store. However, shipping costs rose 30%, cutting net profit to
    $310,000. CEO Laura Méndez said the company will open a second warehouse in Valencia in 2027
    to reduce delivery times and costs.
  checks:
    - {type: contains, value: "4.2"}
    - {type: contains_any, values: ["warehouse", "Valencia"]}
    - {type: word_count, max: 40}
  reference: "Northwind's Q3 revenue rose 12% to $4.2 million, but 30% higher shipping costs cut profit to $310,000, so it will open a Valencia warehouse in 2027."

- id: sum-02
  category: summarization
  difficulty: 0.25
  prompt: |
    Resume el siguiente texto en exactamente 3 viñetas que empiecen por "- ". No añadas nada más.

    El ayuntamiento ha aprobado nuevas restricciones de agua debido a la sequía. A partir del
    1 de julio queda prohibido regar jardines privados entre las 10:00 y las 20:00. Las piscinas
    comunitarias podrán llenarse solo una vez por temporada. El objetivo es reducir el consumo
    un 20% respecto al verano pasado. Las multas por incumplimiento oscilarán entre 300 y 3.000 euros.
  checks:
    - {type: count_regex, pattern: "(?m)^\\s*[-•*]\\s", min: 3, max: 3}
    - {type: contains, value: "20%"}
  reference: |
    - Desde el 1 de julio se prohíbe regar jardines privados entre las 10:00 y las 20:00.
    - Las piscinas comunitarias solo pueden llenarse una vez por temporada.
    - Se busca reducir el consumo un 20%, con multas de 300 a 3.000 euros.

- id: sum-03
  category: summarization
  difficulty: 0.3
