- id: sum-04
  category: summarization
  difficulty: 0.3
  prompt: |
    Summarize this for a non-technical reader in at most 50 words.

    During a TLS handshake the client and server agree on a protocol version and cipher suite.
    The server presents a certificate signed by a trusted certificate authority, which the client
    verifies to confirm the server's identity. Both sides then perform a key exchange (typically
    ECDHE) to derive shared symmetric session keys without ever sending those keys over the network.
    All subsequent application data is encrypted with these session keys.
  checks:
    - {type: contains, value: "certificate"}
    - {type: contains_any, values: ["key", "encrypt"]}
    - {type: word_count, max: 60}
  reference: "Your browser and the website agree on how to talk securely, the site proves who it is with a trusted certificate, and both secretly create shared keys so everything sent afterwards is encrypted."

- id: sum-05
