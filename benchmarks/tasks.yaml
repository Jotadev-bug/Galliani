# Router benchmark tasks.
#
# Fields:
#   id, category        identifier and PROJECT.md section-16 category
#   difficulty          0-1 author estimate. Used ONLY by --simulate dry-runs, never by routers.
#   prompt              sent verbatim to the model
#   checks              automatic quality checks (see benchmarks/evaluate.py)
#   reference           a correct answer; tests assert it passes every check
#
# Not yet covered (text-only MVP): multimodal analysis, tool-using tasks.

- id: conv-01
  category: conversation
  difficulty: 0.05
  prompt: "Hi! What's a good name for a golden retriever puppy? Give me just one name, no explanation."
  checks:
    - {type: word_count, max: 12}
  reference: "Sunny"

- id: conv-02
  category: conversation
  difficulty: 0.05
  prompt: "¿Qué día de la semana viene después del martes? Responde con una sola palabra."
  checks:
    - {type: contains, value: "miércoles"}
    - {type: word_count, max: 3}
  reference: "Miércoles"

- id: conv-03
  category: conversation
  difficulty: 0.1
  prompt: "What is the capital of Australia? Answer in one short sentence."
  checks:
    - {type: contains, value: "Canberra"}
  reference: "The capital of Australia is Canberra."

- id: conv-04
  category: conversation
  difficulty: 0.1
  prompt: "I'm stressed about an exam tomorrow. Give me exactly 3 short tips as a numbered list (1., 2., 3.) and nothing else."
  checks:
    - {type: count_regex, pattern: "(?m)^\\s*\\**\\d+[.)]", min: 3, max: 3}
  reference: |
    1. Review your summary notes, not everything.
    2. Sleep at least seven hours.
    3. Eat a light breakfast and arrive early.

