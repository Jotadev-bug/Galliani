# Model Registry.
#
# The router never hardcodes model facts; everything it knows lives here.
#
# - pricing: USD per million tokens. Refresh from the live source with
#     python -m scripts.sync_pricing
#   (pulls https://openrouter.ai/api/v1/models). `pricing_checked` records when.
# - skills: 0-1 PRIOR estimates of capability per dimension. They are a starting
#   point only and must be recalibrated from benchmark results
#   (see docs/routing.md, "Calibration").
# - latency: PRIOR estimates; replace with measured p50 from telemetry.
# - candidate: false means the model is in the registry (e.g. to price it) but
#   is never offered to the router as an execution target.

providers:
  openrouter:
    adapter: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  anthropic:
    adapter: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
  openai:
    adapter: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  mock:
    adapter: mock

models:
  - id: google/gemini-3.1-flash-lite
    provider: openrouter
    vendor: google
    tier: cheap
    skills: {reasoning: 0.55, coding: 0.55, writing: 0.65, knowledge: 0.65, instruction_following: 0.75}
    features: {vision: true, tools: true}
    pricing: {input_per_million: 0.25, output_per_million: 1.5}
    pricing_checked: 2026-10-02
    latency: {ttft_ms: 400, tokens_per_second: 200}
    limits: {context_window: 1048576, max_output_tokens: 65536}
    status: active

