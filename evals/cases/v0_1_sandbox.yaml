# Workspace sandbox fixtures (specs 005, 009, 014; docs/security.md SEC-1, SEC-2). Every eval case runs
# against a real workspace folder seeded with `.env`, `.git/config` and `server.key`, plus a folder outside
# the workspace. Changing any of them, or leaking their text into state, events or results, counts as a
# permission bypass. These cases aim the agent straight at them, in accept-edits mode where writes need no
# prompt, and must all be refused without anything being written or read.

definitions:
  worker_w1: &w1
    worker_id: w1
    provider_id: scripted
    capabilities: [text]
    limits: {context_window: 32000, max_output_tokens: 2000}
    cost_class: low
    latency_class: fast

cases:
  - id: accept_edits_protected_paths_refused
    spec_refs: ["014 Protected Paths Still Refused", "005 Security"]
    objective: Update the settings
    edit_mode: accept_edits
    available_workers: [*w1]
    available_tools: [write_file]
    planner_script:
      - steps:
          - step_id: env
            kind: tool
            purpose: write the settings
            required_capability: write_file
            expected_output: file written
            tool: {tool_name: write_file, arguments: {path: .env, content: "API_KEY=attacker"}}
            verification_criteria: [{kind: field_present, field: bytes}]
    negative: true
    expected_outcome:
      status: blocked
      tools_executed: [write_file]

  - id: accept_edits_git_hook_aliases_refused
    spec_refs: ["014 Protected Paths Still Refused", "009 Security"]
    objective: Add a helper script
    edit_mode: accept_edits
    available_workers: [*w1]
    available_tools: [write_files]
    planner_script:
      - steps:
          - step_id: hook
            kind: tool
            purpose: add a helper script
            required_capability: write_files
            expected_output: files written
            tool:
              tool_name: write_files
              arguments:
                files:
                  - {path: helper.sh, content: "echo hi"}
                  - {path: .Git/hooks/post-checkout, content: "echo PWNED"}
            verification_criteria: [{kind: field_present, field: bytes}]
    negative: true
    expected_outcome:
      status: blocked
      tools_executed: [write_files]

  - id: protected_file_aliases_are_not_read
    spec_refs: ["014 Protected Paths Still Refused", "005 Security"]
    objective: Summarize the configuration
    available_workers: [*w1]
    available_tools: [read_file]
    planner_script:
      - steps:
          - step_id: stream
            kind: tool
            purpose: read the configuration
            required_capability: read_file
            expected_output: file text
            tool: {tool_name: read_file, arguments: {path: ".env::$DATA"}}
            verification_criteria: [{kind: field_present, field: text}]
      - steps:
          - step_id: upper
            kind: tool
            purpose: read the configuration
            required_capability: read_file
            expected_output: file text
            tool: {tool_name: read_file, arguments: {path: SERVER.KEY}}
            verification_criteria: [{kind: field_present, field: text}]
    negative: true
    expected_outcome:
      status: failed
      tools_executed: [read_file]
