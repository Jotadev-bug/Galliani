# Spec 010 fixtures: explicit, approved memory writes; denials; secrets; scoped retrieval does not block.
# Gates: unauthorized_memory_writes = 0, secret_memory_persistence = 0.

definitions:
  worker_w1: &w1
    worker_id: w1
    provider_id: scripted
    capabilities: [text]
    limits: {context_window: 32000, max_output_tokens: 2000}
    cost_class: low
    latency_class: fast
  remember_plan: &remember_plan
    steps:
      - step_id: m
        kind: tool
        purpose: save the user's preference
        required_capability: remember
        expected_output: saved note
        tool: {tool_name: remember, arguments: {content: "Write summaries in Spanish", type: preference}}
        verification_criteria: [{kind: field_present, field: id}]

cases:
  - id: memory_write_approved
    spec_refs: ["010 Explicit Write", "009 Needs User"]
    objective: Remember that I want summaries in Spanish
    available_workers: [*w1]
    available_tools: [remember]
    memory: []
    user_action: approve
    planner_script: [*remember_plan]
    expected_outcome:
      status: done
      memory_records: 1
      events_include: [approval_recorded]

  - id: memory_write_needs_approval
    spec_refs: ["010 R2 writes are policy-controlled"]
    negative: true
    objective: Remember that I want summaries in Spanish
    available_workers: [*w1]
    available_tools: [remember]
    memory: []
    planner_script: [*remember_plan]
    expected_outcome:
      status: waiting_for_user
      memory_records: 0

  - id: memory_write_denied
    spec_refs: ["010 Denied writes are observations", "009 Denied"]
    negative: true
    objective: Remember that I want summaries in Spanish
    available_workers: [*w1]
    available_tools: [remember]
    memory: []
    user_action: deny
    planner_script: [*remember_plan]
    expected_outcome:
      status: blocked
      memory_records: 0

  - id: memory_secret_never_saved
    spec_refs: ["010 Security", "004 Security"]
    negative: true
    objective: Remember my API key
    available_workers: [*w1]
    available_tools: [remember]
    memory: []
    user_action: approve
    planner_script:
      - steps:
          - step_id: m
            kind: tool
            purpose: save the key
            required_capability: remember
            expected_output: saved note
            tool: {tool_name: remember, arguments: {content: "my key is sk-abcdefghijklmnopqrstuvwxyz123456"}}
            verification_criteria: [{kind: field_present, field: id}]
    expected_outcome:
      status: blocked
      memory_records: 0

  - id: memory_retrieved_task_completes
    spec_refs: ["010 Scoped Retrieval", "010 Separate State"]
    objective: Summarize the budget
    available_workers: [*w1]
    available_tools: []
    memory:
      - {content: "Always mention the budget variance", type: preference}
      - {content: "Dentist on Friday", type: note}
    planner_script:
      - steps:
          - step_id: s1
            kind: model
            purpose: summarize
            required_capability: text
            expected_output: summary
            instruction: Summarize the budget.
            verification_criteria: [{kind: contains, value: budget}]
    worker_script: {w1: [{output: "The budget variance is 4% under plan."}]}
    expected_outcome:
      status: done
      memory_records: 2   # observations are not written to memory
      events_include: [memory_retrieved]
