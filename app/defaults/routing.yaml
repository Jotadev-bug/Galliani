# Routing policy. Every number here is an experiment knob, not a truth.
# Calibrate from benchmark data before trusting any of them.

# Utility = quality_weight * P(success)
#         - cost_weight    * cost_penalty     (0-1, log-scaled across candidates)
#         - latency_weight * latency_penalty  (0-1, log-scaled across candidates)
#         - risk_weight    * (1 - P(success)) * precision_required
#
# min_success: the "sufficiently capable" bar. Among candidates whose estimated
# P(success) >= min_success the highest-utility one wins; if none clears the bar
# the candidate with the highest P(success) wins.
modes:
  auto:     {quality_weight: 1.0, cost_weight: 0.5, latency_weight: 0.3, risk_weight: 0.8, min_success: 0.85}
  cheapest: {quality_weight: 1.0, cost_weight: 2.0, latency_weight: 0.1, risk_weight: 0.3, min_success: 0.70}
  fastest:  {quality_weight: 1.0, cost_weight: 0.3, latency_weight: 2.0, risk_weight: 0.3, min_success: 0.70}
  best:     {quality_weight: 1.0, cost_weight: 0.0, latency_weight: 0.0, risk_weight: 1.0, min_success: 0.99}

# Success-probability model: P = prod over dimensions of
#   sigmoid(steepness * (skill - requirement) + bias)
# bias > 0 means a model whose skill equals the requirement usually succeeds.
success_model:
  steepness: 12.0
  bias: 1.5

# Jev confidence policy (section 11 of PROJECT.md).
confidence:
  execute_threshold: 0.90   # >= : execute the routed model
  safer_threshold: 0.70     # [safer, execute) : escalate one capability step
                            # <  safer : fall back to the most capable candidate
  # When the router gives a probability per model (jev-choice), escalate only among models it
  # rated at least plausible_min_probability. Set false for the literal PROJECT.md section 11
  # behaviour (low confidence -> most capable model overall, even one the router ruled out).
  respect_router_distribution: true
  plausible_min_probability: 0.05

# Jev settings. Jev (TypeSafe) is a decision model called through the OpenRouter Decisions API.
jev:
  # choice:      Jev picks the model itself from the candidates' descriptions and prices.
  # profile:     Jev scores the task's requirements; the utility function above picks the model.
  # sufficiency: Jev answers "would a <tier> model get this right?" per tier; cheapest sufficient tier wins.
  # All three come from the same Jev call; the benchmark compares them.
  decision: choice
  # Escalate low-confidence picks with the confidence policy above. On: Jev's own pick alone sent
  # 11/13 hard tasks to mid-tier models, but its confidence on them was low (0.15-0.32 vs ~0.9+ on
  # simple tasks), and escalating on that signal routed 12/13 correctly while staying 79% cheaper
  # than always-Fable over 100 prompts (benchmarks/routing_eval.py, 2026-10-02).
  escalate: true
  choice_instructions:
    auto: "Which model should answer `user_request`? Pick the cheapest model that will answer it completely and correctly. Choose a more expensive model only when the task clearly needs its extra capability."
    cheapest: "Which model should answer `user_request`? Pick the lowest-priced model that can still give an acceptable answer."
    fastest: "Which model should answer `user_request`? Pick the fastest model that can still give an acceptable answer."
    best: "Which model should answer `user_request`? Pick the model most likely to give the best possible answer, regardless of price."
  choice_assumed_output_tokens: 500
  selector_model: typesafe/jev-1.13
  timeout_s: 20
  max_state_chars: 6000        # Jev has a 32K context and loses accuracy on large state
  output_tokens_by_level: [20, 150, 600, 2500]
  tier_descriptions:
    cheap: "small, fast, low-cost AI model (good at simple questions, translation, short summaries, extraction and classification; weak at multi-step reasoning, hard math and non-trivial code)"
    mid: "mid-size general-purpose AI model (solid at writing, everyday coding and moderate reasoning; can slip on hard math or tricky logic)"
    strong: "strong AI model (reliable at complex coding, debugging, document analysis and most reasoning)"
    frontier: "most capable frontier AI model available (best at hard reasoning, proofs, difficult math and expert-level problems)"

# Baseline rules router (experiment #3): task_type -> tier.
rules:
  default_tier: cheap
  task_type_tiers:
    coding: strong
    debugging: strong
    reasoning: frontier
    math: frontier
    planning: strong
    document_analysis: strong
    writing: mid
    analysis: mid

# Fallback execution.
fallback:
  max_attempts: 3
  request_timeout_s: 120
  # Upper bound on the estimated cost of any single fallback attempt (USD).
  max_cost_per_request: 1.0
