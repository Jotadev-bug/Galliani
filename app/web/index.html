<style>
:root, :root[data-theme="dark"] {

  --text: #ececf1;
  --muted: #a1a1aa;
  --faint: #6e6e78;
  --accent: #6d6ef7;
  --accent-2: #8b7cf8;
  --accent-text: #ffffff;
  --good: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;

}
:root[data-theme="light"] {
  --bg: #fafafa; --sidebar: #f3f3f5; --surface: #ffffff; --surface-2: #f4f4f6; --hover: #ececf0;
  --border: #e4e4e8; --border-strong: #d4d4da; --text: #18181b; --muted: #5f5f6a; --faint: #9a9aa5;
  --accent: #5b5cf0; --accent-2: #7c6cf2; --good: #16a34a; --warn: #b45309; --bad: #dc2626;
  --bad-soft: rgba(220, 38, 38, .08); --code-bg: #f4f4f6; --shadow: 0 1px 2px rgba(0,0,0,.05); color-scheme: light;
}

    --bg: #fafafa; --sidebar: #f3f3f5; --surface: #ffffff; --surface-2: #f4f4f6; --hover: #ececf0;
    --border: #e4e4e8; --border-strong: #d4d4da; --text: #18181b; --muted: #5f5f6a; --faint: #9a9aa5;
    --accent: #5b5cf0; --accent-2: #7c6cf2; --good: #16a34a; --warn: #b45309; --bad: #dc2626;
    --bad-soft: rgba(220, 38, 38, .08); --code-bg: #f4f4f6; --shadow: 0 1px 2px rgba(0,0,0,.05); color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14.5px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace; font-variant-ligatures: none; }

.app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
.app.collapsed { grid-template-columns: 0 1fr; }
.app.collapsed .sidebar { visibility: hidden; }

/* ------------------------------------------------------------- sidebar */
.sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px 20px; }
.brand .name { font-size: 21px; font-weight: 650; letter-spacing: -.02em; flex: 1; }
.logo { width: 30px; height: 30px; flex: none; }
.icon-btn { width: 34px; height: 34px; border-radius: 9px; display: inline-grid; place-items: center; color: var(--muted); border: 1px solid transparent; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.boxed { border-color: var(--border); }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
.new-chat {
  margin: 4px 14px 18px; height: 44px; border: 1px solid var(--border-strong); border-radius: 11px;
  display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; background: var(--surface); font-weight: 500;
}
.new-chat:hover { background: var(--hover); }
.new-chat .label { flex: 1; text-align: left; }
kbd { font: 11.5px/1 ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; color: var(--muted); border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 6px; background: var(--surface-2); }
.section-label { color: var(--faint); font-size: 12.5px; padding: 0 20px 8px; }
.chats { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.chat-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 9px; cursor: pointer; min-height: 40px; }
.chat-item:hover { background: var(--hover); }
.chat-item.active { background: var(--surface-2); }
.chat-item .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
.chat-item .when { color: var(--faint); font-size: 12px; white-space: nowrap; }
.chat-item .del { display: none; width: 24px; height: 24px; }
.chat-item:hover .when { display: none; }
.chat-item:hover .del { display: inline-grid; }
.chat-item .del:hover { color: var(--bad); }
.no-chats { color: var(--faint); font-size: 13px; padding: 4px 12px; }
.nav { border-top: 1px solid var(--border); padding: 10px 8px; }
.nav button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 9px; color: var(--muted); font-size: 14px; }
.nav button:hover, .nav button.active { background: var(--hover); color: var(--text); }
.warn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: auto; }
.credit { margin: 4px 14px 16px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); display: flex; align-items: center; gap: 12px; }
.credit .k { color: var(--accent-2); font-size: 13px; font-weight: 500; }
.credit .v { font-size: 15px; font-weight: 500; }
.credit .grow { flex: 1; min-width: 0; }
.btn {
  height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface-2);
  font-size: 13.5px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none; color: var(--text);
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }

/* ------------------------------------------------------------- main */
.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topline { display: flex; align-items: center; gap: 8px; padding: 14px 20px 0; }
.show-sidebar { display: none; }
.app.collapsed .show-sidebar { display: inline-grid; }
.routebar {
  flex: 1; display: grid; grid-template-columns: minmax(220px, 1.4fr) auto auto auto 44px; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; min-height: 74px; min-width: 0;
}
.routebar > .cell { padding: 12px 20px; min-width: 0; }
.routebar > .cell + .cell { border-left: 1px solid var(--border); }
.rb-mode { display: flex; gap: 12px; align-items: flex-start; text-align: left; border-radius: 14px 0 0 14px; height: 100%; }
.rb-mode:hover { background: var(--hover); }
.ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent-2); margin-top: 5px; flex: none; }
.rb-k { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.rb-v { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
.rb-title { font-size: 15px; white-space: nowrap; }
.rb-sub { color: var(--muted); font-size: 13px; }
#rbReason { color: var(--muted); font-size: 13.5px; max-width: 290px; display: block; }
.conf-good { color: var(--good); } .conf-warn { color: var(--warn); } .conf-bad { color: var(--bad); }
.rb-toggle { justify-self: center; }
.rb-toggle svg { transition: transform .15s; }
.rb-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.rb-empty { color: var(--faint); }

.menu { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.35); width: 300px; }
.menu button { width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: flex-start; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); }
.menu .mt { font-size: 14px; } .menu .ms { color: var(--muted); font-size: 12.5px; }
.menu .check { width: 16px; height: 16px; margin-top: 3px; color: var(--accent-2); flex: none; }

.details { margin: 10px 20px 0; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; font-size: 13.5px; }
.why-text { margin: 0 0 12px; }
.options { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.options td { padding: 5px 0; vertical-align: middle; }
.options td.n { width: 38%; padding-right: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; color: var(--muted); }
.options tr.picked td.n { color: var(--text); font-weight: 600; }
.options td.c { width: 80px; text-align: right; color: var(--muted); padding-left: 12px; }
.track { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
.fill { height: 100%; border-radius: 3px; background: var(--faint); }
tr.picked .fill { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.tag { font-size: 11px; color: var(--faint); margin-left: 6px; font-weight: 400; }

.scroll { flex: 1; overflow-y: auto; }
.thread { max-width: 900px; margin: 0 auto; padding: 24px 24px 12px; }

.welcome { text-align: center; padding: 9vh 0 0; }
.welcome .logo { width: 76px; height: 76px; margin-bottom: 18px; }
.welcome h1 { font-size: clamp(28px, 4vw, 38px); margin: 0 0 12px; letter-spacing: -.02em; font-weight: 650; }
.welcome p { color: var(--muted); font-size: 17px; margin: 0 0 40px; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; max-width: 900px; margin: 0 auto; }
.card { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 18px 20px 20px; min-height: 128px; display: flex; flex-direction: column; gap: 14px; text-align: left; line-height: 1.5; }
.card:hover { border-color: var(--border-strong); background: var(--hover); }
.card svg.i { width: 24px; height: 24px; }
.c-blue { color: #60a5fa; } .c-green { color: #4ade80; } .c-purple { color: #a78bfa; } .c-yellow { color: #facc15; }

.msg { margin: 0 0 22px; }
.msg.user { display: flex; justify-content: flex-end; }
.bubble { background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px 16px 4px 16px; padding: 10px 15px; max-width: min(680px, 90%); white-space: pre-wrap; overflow-wrap: anywhere; }
.answer { overflow-wrap: anywhere; }
.body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
.body p { margin: 0 0 .85em; }
.body h1, .body h2, .body h3, .body h4 { margin: 1.1em 0 .5em; line-height: 1.3; }
.body h1 { font-size: 1.35em; } .body h2 { font-size: 1.18em; } .body h3, .body h4 { font-size: 1.02em; }
.body ul, .body ol { margin: 0 0 .85em; padding-left: 1.4em; }
.body li { margin: .2em 0; }
.body code { font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; font-variant-ligatures: none; font-size: .88em; background: var(--surface-2); padding: .12em .38em; border-radius: 5px; }
.body pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 11px; padding: 13px 15px; overflow-x: auto; margin: 0 0 .9em; }
.body pre code { background: none; padding: 0; font-size: 13px; line-height: 1.55; }
.body a { color: var(--accent-2); }
.body blockquote { margin: 0 0 .85em; padding-left: 12px; border-left: 3px solid var(--border-strong); color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 12px; color: var(--muted); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px 3px 8px; color: var(--text); font-weight: 500; background: var(--surface); }
.chip:hover { border-color: var(--border-strong); }
.saved { color: var(--good); }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(251,191,36,.14); color: var(--warn); }
.vendor { width: 14px; height: 14px; flex: none; }
.copy-btn { color: var(--faint); display: inline-flex; }
.copy-btn:hover { color: var(--text); }
.copy-btn svg.i { width: 16px; height: 16px; }
.preview { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 14px 18px; }
.preview .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.preview .actions { display: flex; gap: 8px; margin-top: 14px; }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 4px 2px; }
.spin { width: 14px; height: 14px; border: 2px solid var(--border-strong); border-top-color: var(--accent-2); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
.error { border: 1px solid rgba(248,113,113,.35); background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 12px 16px; }
.error pre { white-space: pre-wrap; font-size: 12px; margin: 8px 0 0; }

/* ------------------------------------------------------------- composer */
.composer { padding: 10px 24px 22px; }
.box { max-width: 940px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 16px; padding: 14px 14px 12px 18px; box-shadow: var(--shadow); }
.box:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--border-strong)); }
.box textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; padding: 2px 0 10px; min-height: 28px; max-height: 38vh; line-height: 1.5; font-size: 15px; }
.box textarea:focus-visible { outline: none; }
.box textarea::placeholder { color: var(--faint); }
.tools { display: flex; align-items: center; gap: 6px; }
.tools .spacer { flex: 1; }
.tool { height: 34px; padding: 0 9px; border-radius: 9px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }
.tool:hover { background: var(--hover); color: var(--text); }
.tool:disabled { opacity: .45; cursor: default; background: none; }
.send { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
.send:disabled { opacity: .45; cursor: default; }
.send svg.i { width: 20px; height: 20px; stroke-width: 2.2; }

/* ------------------------------------------------------------- pages */
.page { max-width: 780px; margin: 0 auto; padding: 28px 24px 40px; }
.page h2 { font-size: 24px; margin: 0 0 6px; letter-spacing: -.01em; }
.page .lead { color: var(--muted); margin: 0 0 24px; }
.panel { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; margin-bottom: 14px; }
.panel .row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
.panel .row + .row { border-top: 1px solid var(--border); }
.panel .grow { flex: 1; min-width: 0; }
.panel .title { font-weight: 550; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel .sub { color: var(--muted); font-size: 13px; }
.price { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
.pill.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.pill.req { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.key-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 16px 18px; }
.key-row + .key-row { border-top: 1px solid var(--border); }
.key-row .head { display: flex; align-items: center; gap: 8px; font-weight: 550; grid-column: 1 / -1; }
.key-row .note { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin-top: -4px; }
.key-row input { height: 38px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--bg); padding: 0 12px; font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; font-size: 13px; width: 100%; min-width: 0; }
.key-row .btns { display: flex; gap: 8px; }
.link { color: var(--accent-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
.stat { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 16px 18px; }
.stat .k { color: var(--muted); font-size: 12.5px; }
.stat .v { font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; border: 1px solid var(--border); flex-wrap: wrap; }
.seg button { padding: 5px 12px; border-radius: 8px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.foot-note { color: var(--faint); font-size: 12.5px; margin-top: 10px; }

/* ------------------------------------------------------------- agent (spec 012) */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.page.wide { max-width: 1040px; }
.agent-form { padding: 18px; display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field > span { font-weight: 550; font-size: 13.5px; }
.field small { color: var(--muted); font-size: 12.5px; }
.field textarea, .field input { border: 1px solid var(--border-strong); border-radius: 9px; background: var(--bg); padding: 9px 12px; width: 100%; min-width: 0; resize: vertical; }
.field input { height: 38px; padding: 0 12px; }
.inline { display: flex; gap: 8px; }
details.field summary { cursor: pointer; color: var(--muted); font-size: 13.5px; width: fit-content; }
details.field[open] { gap: 12px; }
.form-foot { display: flex; align-items: center; gap: 12px; }
.form-error { color: var(--bad); font-size: 13px; flex: 1; }
.section-title { color: var(--faint); font-size: 12.5px; margin: 22px 0 8px; }
.task-row { width: 100%; text-align: left; }
.task-row:hover { background: var(--hover); }
.agent-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.agent-head h2 { flex: 1; font-size: 20px; margin: 4px 0 0; overflow-wrap: anywhere; }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: var(--bad-soft); }
.pill.run { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 35%, transparent); display: inline-flex; gap: 6px; align-items: center; }
.pill .spin { width: 10px; height: 10px; border-width: 1.5px; }
.status-pill { font-size: 12.5px; padding: 4px 10px; margin-top: 6px; white-space: nowrap; }
.callout { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border)); background: color-mix(in srgb, var(--warn) 7%, var(--surface)); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
.callout.question { border-color: color-mix(in srgb, var(--accent-2) 45%, var(--border)); background: color-mix(in srgb, var(--accent-2) 7%, var(--surface)); }
.callout h3 { margin: 0 0 6px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.callout h3:focus { outline: none; }
.callout h3:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.callout .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.callout textarea { width: 100%; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--bg); padding: 9px 12px; margin-top: 8px; resize: vertical; }
.callout .q { display: block; font-size: 14.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.agent-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.panel-head { padding: 12px 18px; border-bottom: 1px solid var(--border); font-weight: 550; display: flex; gap: 8px; align-items: center; }
.panel-head .sub { font-weight: 400; }
.steps, .feed { list-style: none; margin: 0; padding: 6px 0; }
.step { display: flex; gap: 12px; padding: 9px 18px; align-items: flex-start; }
.step[aria-current="step"] { background: var(--surface-2); }
.step .st { width: 20px; height: 20px; flex: none; display: grid; place-items: center; font-size: 13px; margin-top: 1px; }
.step.verified .st { color: var(--good); } .step.failed .st { color: var(--bad); } .step.waiting .st { color: var(--warn); }
.step.pending .st, .step.canceled .st { color: var(--faint); }
.step .title { font-size: 14px; }
.step .sub, .revision { color: var(--muted); font-size: 12.5px; }
.revision { padding: 0 18px 12px; margin: 0; }
.feed { max-height: 420px; overflow-y: auto; font-size: 13px; }
.feed li { display: grid; grid-template-columns: 64px 104px 1fr; gap: 8px; padding: 5px 18px; }
.feed time { color: var(--faint); font-variant-numeric: tabular-nums; }
.feed .ev { color: var(--muted); }
.feed .sum { overflow-wrap: anywhere; }
.result { margin-bottom: 14px; }
.result .out { padding: 0 18px 14px; overflow-wrap: anywhere; }
.result pre { white-space: pre-wrap; font-size: 12.5px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 0; }
.verif { display: flex; gap: 8px; align-items: flex-start; padding: 0 18px 12px; font-size: 13.5px; }
.verif.pass { color: var(--good); } .verif.fail { color: var(--bad); } .verif.none { color: var(--muted); }
.files { padding: 0 18px 14px; font-size: 13.5px; }
.files ul { margin: 4px 0 0; padding-left: 18px; }
.next { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 18px 16px; }
.memory-note { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); font-size: 13px; border: 1px dashed var(--border-strong); border-radius: 12px; padding: 10px 14px; margin-top: 14px; }
.stale { display: flex; align-items: center; gap: 12px; border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border)); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; color: var(--warn); }
.stale span { flex: 1; }
.usage-line { color: var(--faint); font-size: 12.5px; margin-top: 10px; }
@media (max-width: 1000px) { .agent-grid { grid-template-columns: 1fr; } }

@media (max-width: 1150px) {
  .routebar { grid-template-columns: minmax(200px, 1fr) auto auto 44px; }
  .rb-reason { display: none; }
  .cards { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 760px) {
  .app, .app.collapsed { grid-template-columns: 1fr; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 290px; z-index: 30; transform: translateX(-100%); transition: transform .2s; visibility: visible !important; }
  .app.open .sidebar { transform: none; box-shadow: 0 0 60px rgba(0,0,0,.5); }
  .show-sidebar { display: inline-grid !important; }
  .routebar { grid-template-columns: 1fr auto 44px; min-height: 60px; }
  .rb-model, .rb-sub { display: none; }
  .routebar > .cell { padding: 10px 14px; }
  .thread, .composer, .page { padding-left: 14px; padding-right: 14px; }
  .topline { padding: 10px 14px 0; }
  .cards { grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { min-height: 0; padding: 14px; }
  .welcome { padding-top: 4vh; }
  .welcome p { margin-bottom: 24px; }
  .stats { grid-template-columns: 1fr; }
  .details { margin: 10px 14px 0; }
  .feed li { grid-template-columns: 56px 1fr; }
  .feed .ev { display: none; }
  .inline { flex-wrap: wrap; }
}

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k, fallback = null) { try { const v = localStorage.getItem(k); return v === null ? fallback : v; } catch { return fallback; } },
  set(k, v) { try { v === null || v === "" ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  json(k, fallback) { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } },
  setJson(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const APP_TOKEN = new URLSearchParams(location.search).get("token");
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform);
const MODES = {
  auto: ["Auto (Galliani Router)", "Choose the best model for your task", "Auto"],
  cheapest: ["Cheapest", "Lowest price that still does the job", "Cheapest"],
  fastest: ["Fastest", "Quickest model that still does the job", "Fastest"],
  best: ["Best quality", "Most capable model, regardless of price", "Best"],
};
const SUGGESTIONS = [
  ["i-file", "c-blue", "Summarize a text and list the key takeaways", "Summarize the following text and list the key takeaways:\n\n"],
  ["i-code", "c-green", "Write a function in Python to parse a CSV file", "Write a function in Python to parse a CSV file"],
  ["i-lang", "c-purple", "Translate a message into another language", "Translate into English: "],
  ["i-bulb", "c-yellow", "Explain a concept like I'm five", "Explain like I'm five: "],
];
// id, label, required, note, where to get a key, request header (web mode)
const PROVIDERS = [
  ["openrouter", "OpenRouter", true, "Runs Jev and every model.", "https://openrouter.ai/settings/keys", "X-OpenRouter-Key"],
  ["anthropic", "Anthropic", false, "Claude models run on your Anthropic account instead.", "https://console.anthropic.com/settings/keys", "X-Anthropic-Key"],
  ["openai", "OpenAI", false, "GPT models run on your OpenAI account instead.", "https://platform.openai.com/api-keys", "X-OpenAI-Key"],
];
const PROVIDER_LABEL = { openrouter: "OpenRouter", anthropic: "Anthropic", openai: "OpenAI" };

const state = {
  chats: store.json("galliani.chats", []),
  currentId: null,
  mode: store.get("galliani.mode", "auto"),
  config: null,
  view: "chat",
  busy: false,
  lastRoute: null,
};

// ------------------------------------------------------------------ formatting
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function modelName(id) {
  return id.split("/").pop().split("-").map((p) => p === "gpt" ? "GPT" : /^\d/.test(p) ? p : p[0].toUpperCase() + p.slice(1))
    .join(" ").replace(/^GPT (\d)/, "GPT-$1");
}
const vendor = (id) => id.split("/")[0];
const vendorIcon = (id) => `<svg class="vendor" aria-hidden="true"><use href="#v-${esc(vendor(id))}"/></svg>`;
const icon = (id, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
function money(x) {
  if (x == null) return "—";
  if (x === 0) return "$0";
  if (x < 0.0001) return "<$0.0001";
  if (x < 0.01) return "$" + x.toFixed(4);
  return "$" + x.toFixed(x < 1 ? 3 : 2);
}
function ago(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 172800) return "Yesterday";
  return Math.floor(s / 86400) + " days ago";
}
const confClass = (c) => c >= 0.9 ? "conf-good" : c >= 0.7 ? "conf-warn" : "conf-bad";

// Small, safe markdown: HTML is escaped first, then a few constructs are rendered.
function markdown(src) {
  const blocks = [];
  let text = src.replace(/```[\w+-]*\n([\s\S]*?)```/g, (_, code) => {
    blocks.push(`<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`);
    return `\u0000${blocks.length - 1}\u0000`;
  });
  text = esc(text);
  const inline = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = []; let list = null, para = [];
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join("<br>"))}</p>`); para = []; } };
  for (const line of text.split("\n")) {
    const block = line.match(/^\u0000(\d+)\u0000$/), h = line.match(/^(#{1,4})\s+(.*)$/);
    const ul = line.match(/^\s*[-*•]\s+(.*)$/), ol = line.match(/^\s*\d+[.)]\s+(.*)$/), q = line.match(/^&gt;\s?(.*)$/);
    if (block) { flush(); closeList(); out.push(blocks[+block[1]]); }
    else if (h) { flush(); closeList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); }
    else if (ul || ol) { flush(); const k = ul ? "ul" : "ol"; if (list !== k) { closeList(); out.push(`<${k}>`); list = k; } out.push(`<li>${inline((ul || ol)[1])}</li>`); }
    else if (q) { flush(); closeList(); out.push(`<blockquote>${inline(q[1])}</blockquote>`); }
    else if (!line.trim()) { flush(); closeList(); }
    else { closeList(); para.push(line); }
  }
  flush(); closeList();
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}

// ------------------------------------------------------------------ API
function keyHeaders() {
  if (state.config?.desktop) return {};  // desktop: keys live in the OS credential store, server-side
  const h = {};
  for (const [id, , , , , header] of PROVIDERS) { const k = store.get(`galliani.key.${id}`); if (k) h[header] = k; }
  return h;
}
async function api(path, body, method) {
  const headers = { "Content-Type": "application/json", ...keyHeaders() };
  if (APP_TOKEN) headers["X-App-Token"] = APP_TOKEN;
  const res = await fetch(path, { method: method || (body ? "POST" : "GET"), headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(res.statusText), { status: res.status, detail: data.detail });
  return data;
}
function keyStatus(id) {
  const c = state.config; if (!c) return "none";
  const k = c.keys?.[id] || {};
  if (c.desktop ? k.saved : store.get(`galliani.key.${id}`)) return "saved";
  return k.env ? "env" : "none";
}
const hasRouterKey = () => keyStatus("openrouter") !== "none";

// ------------------------------------------------------------------ chats
function saveChats() { store.setJson("galliani.chats", state.chats.slice(0, 200)); }
const currentChat = () => state.chats.find((c) => c.id === state.currentId) || null;
function ensureChat(firstPrompt) {
  let chat = currentChat();
  if (!chat) {
    chat = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
             title: firstPrompt.trim().split("\n")[0].slice(0, 60) || "New chat",
             updated: Date.now(), messages: [], items: [] };
    state.chats.unshift(chat);
    state.currentId = chat.id;
  }
  return chat;
}
function touch(chat) {
  chat.updated = Date.now();
  state.chats = [chat, ...state.chats.filter((c) => c.id !== chat.id)];
  saveChats(); renderChatList();
}
function renderChatList() {
  const list = $("chatList");
  if (!state.chats.length) { list.innerHTML = `<div class="no-chats">No chats yet</div>`; return; }
  list.innerHTML = state.chats.map((c) => `
    <div class="chat-item ${c.id === state.currentId && state.view === "chat" ? "active" : ""}" role="button" tabindex="0" data-id="${c.id}">
      ${icon("i-file")}<span class="t">${esc(c.title)}</span><span class="when">${ago(c.updated)}</span>
      <button class="del icon-btn" data-del="${c.id}" title="Delete chat" aria-label="Delete chat">${icon("i-x")}</button>
    </div>`).join("");
}
$("chatList").addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]");
  if (del) {
    e.stopPropagation();
    state.chats = state.chats.filter((c) => c.id !== del.dataset.del);
    if (state.currentId === del.dataset.del) state.currentId = null;
    saveChats(); show("chat"); return;
  }
  const item = e.target.closest(".chat-item");
  if (item) { state.currentId = item.dataset.id; show("chat"); closeMobileSidebar(); }
});
$("chatList").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.classList.contains("chat-item")) e.target.click(); });
function newChat() { state.currentId = null; show("chat"); $("prompt").focus(); closeMobileSidebar(); }
$("newChat").addEventListener("click", newChat);
$("newChatKbd").textContent = IS_MAC ? "⌘ N" : "Ctrl N";
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "n") { e.preventDefault(); newChat(); }
  if (e.key === "Escape") closeMenu();
});

// ------------------------------------------------------------------ routing bar
function taskLabel(r) { const t = r.task_type ? r.task_type.replace("_", " ") : "general task"; return t[0].toUpperCase() + t.slice(1); }
function shortReason(r) {
  if (r.router_error) return "Jev unavailable: safe default";
  return r.escalated ? `${taskLabel(r)}: switched from ${modelName(r.first_choice)}` : `${taskLabel(r)}: best value for this task`;
}
function longReason(r) {
  if (r.router_error) return "Jev couldn't be reached, so the request went to a capable default.";
  const words = { reasoning: "reasoning", coding: "coding", writing: "writing", knowledge: "specialist knowledge", precision: "exactness" };
  const strong = Object.entries(r.signals || {}).filter(([, v]) => v >= 0.6).sort((a, b) => b[1] - a[1]).map(([k]) => words[k]);
  const needs = strong.length ? ` that needs strong ${strong.slice(0, 2).join(" and ")}` : "";
  const what = `${esc(taskLabel(r))}${needs}.`;
  return r.escalated
    ? `${what} Jev's first choice was ${esc(modelName(r.first_choice))}, but at ${Math.round(r.confidence * 100)}% confidence it switched to the more capable <strong>${esc(modelName(r.model_id))}</strong>.`
    : `${what} <strong>${esc(modelName(r.model_id))}</strong> is the cheapest model likely to do it well.`;
}
function detailsHtml(r) {
  const top = Math.max(...r.options.map((o) => o.score), 0.0001);
  const rows = r.options.map((o) => `
    <tr class="${o.model_id === r.model_id ? "picked" : ""}">
      <td class="n">${esc(modelName(o.model_id))}${r.escalated && o.model_id === r.first_choice ? '<span class="tag">first choice</span>' : ""}</td>
      <td><div class="track"><div class="fill" style="width:${Math.max(2, o.score / top * 100).toFixed(0)}%"></div></div></td>
      <td class="c">~${money(o.est_cost)}</td>
    </tr>`).join("");
  const tech = `${r.reason} · routing ${money(r.router_cost)}, ${Math.round(r.router_ms)} ms`;
  return `<p class="why-text" title="${esc(tech)}">${longReason(r)}</p>${rows ? `<table class="options" aria-label="Jev's preference and estimated cost per model">${rows}</table>` : ""}`;
}
function setRoute(r) {
  state.lastRoute = r;

    for (const id of ["rbModel", "rbReason", "rbConf"]) $(id).innerHTML = `<span class="rb-empty">—</span>`;

  }
  $("rbModel").innerHTML = `${vendorIcon(r.model_id)}<span>${esc(modelName(r.model_id))}</span>`;
  $("rbReason").textContent = shortReason(r);
  $("rbReason").title = shortReason(r);
  $("rbConf").innerHTML = `<span class="${confClass(r.confidence)}">${Math.round(r.confidence * 100)}%</span>`;
  tog.disabled = false;
  $("details").innerHTML = detailsHtml(r);
}
function toggleDetails(open) {

}

// ------------------------------------------------------------------ views
function show(view) {
  state.view = view;
  document.querySelectorAll(".nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
  $("composer").hidden = view !== "chat";
  document.querySelector(".routebar").hidden = view === "agent";  // chat routing does not apply to agent tasks
  $("details").hidden ||= view === "agent";
  renderChatList();
  ({ chat: renderChat, agent: renderAgent, models: renderModels, settings: renderSettings, usage: renderUsage, keys: renderKeys })[view]();
  $("scroll").scrollTop = view === "chat" ? $("scroll").scrollHeight : 0;
}
document.querySelectorAll(".nav button").forEach((b) => b.addEventListener("click", () => { show(b.dataset.view); closeMobileSidebar(); }));

function renderChat() {
  const chat = currentChat();
  if (!chat || !chat.items.length) {
    setRoute(null);
    $("view").innerHTML = `
      <div class="thread"><section class="welcome">
        <svg class="logo" aria-hidden="true"><use href="#logo"/></svg>
        <h1>Welcome to Galliani</h1>
        <p>You prompt. We pick the right model.</p>
        <div class="cards">${SUGGESTIONS.map(([ic, color, label], i) =>
          `<button class="card" data-s="${i}">${icon(ic, color)}<span>${esc(label)}</span></button>`).join("")}</div>
      </section></div>`;
    $("view").querySelectorAll(".card").forEach((c) => c.addEventListener("click", () => {
      const t = $("prompt"); t.value = SUGGESTIONS[+c.dataset.s][3]; grow(); t.focus();
      t.selectionStart = t.selectionEnd = t.value.length;
    }));
    return;
  }
  $("view").innerHTML = `<div class="thread" id="thread"></div>`;
  for (const item of chat.items) appendItem(item, false);
  const last = [...chat.items].reverse().find((i) => i.route);
  setRoute(last ? last.route : null);
}

function appendItem(item, scroll = true) {
  const thread = $("thread"); if (!thread) return;
  const el = document.createElement("div");
  el.className = "msg" + (item.kind === "user" ? " user" : "");
  if (item.kind === "user") el.innerHTML = `<div class="bubble">${esc(item.text)}</div>`;
  else if (item.kind === "answer") el.innerHTML = answerHtml(item);
  else if (item.kind === "preview") el.innerHTML = previewHtml(item);
  else el.innerHTML = `<div class="error" role="alert"><strong>${esc(item.text)}</strong>${item.extra ? `<pre class="mono">${esc(item.extra)}</pre>` : ""}</div>`;
  thread.appendChild(el);
  wire(el, item);
  if (scroll) scrollDown();
  return el;
}
function scrollDown() { requestAnimationFrame(() => $("scroll").scrollTo({ top: $("scroll").scrollHeight, behavior: "smooth" })); }

function answerHtml(item) {
  const r = item.res;
  const pct = r.frontier_cost > 0 ? Math.round((1 - r.total_cost / r.frontier_cost) * 100) : 0;
  const via = r.provider && r.provider !== "openrouter" ? `<span>via ${esc(PROVIDER_LABEL[r.provider] || r.provider)}</span>` : "";
  const fell = r.attempts.length > 1 ? `<span class="badge" title="${esc(r.errors.join("\n"))}">fallback</span>` : "";
  const saved = r.model_id !== r.frontier_model && pct > 0 ? `<span class="saved">${pct}% less than ${esc(modelName(r.frontier_model))}</span>` : "";
  return `<div class="answer"><div class="body">${markdown(r.answer || "_(empty answer)_")}</div>
    <div class="meta">
      <button class="chip" data-act="route" title="Routing details">${vendorIcon(r.model_id)}${esc(modelName(r.model_id))}</button>
      ${via}${fell}<span>${money(r.total_cost)}</span>${saved}<span>${(r.latency_ms / 1000).toFixed(1)} s</span>
      <button class="copy-btn" data-act="copy" title="Copy" aria-label="Copy answer">${icon("i-copy")}</button>
    </div></div>`;
}
function previewHtml(item) {
  const r = item.route;
  return `<div class="preview">
    <div class="row">${vendorIcon(r.model_id)}<strong>${esc(modelName(r.model_id))}</strong>
      <span class="${confClass(r.confidence)}">${Math.round(r.confidence * 100)}%</span>
      ${r.escalated ? '<span class="badge">switched</span>' : ""}</div>
    ${detailsHtml(r)}
    ${item.done ? "" : `<div class="actions"><button class="btn primary" data-act="run">Run with ${esc(modelName(r.model_id))}</button></div>`}
  </div>`;
}
function wire(el, item) {
  el.querySelector('[data-act="route"]')?.addEventListener("click", () => { if (item.route) { setRoute(item.route); toggleDetails(true); } });
  el.querySelector('[data-act="copy"]')?.addEventListener("click", (e) => {
    navigator.clipboard?.writeText(item.res.answer);
    const b = e.currentTarget; b.innerHTML = icon("i-check"); setTimeout(() => (b.innerHTML = icon("i-copy")), 1200);
  });
  el.querySelector('[data-act="run"]')?.addEventListener("click", () => {
    item.done = true; saveChats();
    el.querySelector(".actions")?.remove();
    send(item.prompt, item.route);
  });
}

// ------------------------------------------------------------------ sending
function busy(on, label) {
  state.busy = on;
  $("sendBtn").disabled = on; $("previewBtn").disabled = on;
  document.getElementById("thinking")?.remove();
  if (on && $("thread")) {
    const el = document.createElement("div"); el.className = "msg"; el.id = "thinking";
    el.innerHTML = `<div class="thinking"><span class="spin"></span>${esc(label)}</div>`;
    $("thread").appendChild(el); scrollDown();
  }
}
function openThread(chat) {
  if ($("thread")) return;
  $("view").innerHTML = `<div class="thread" id="thread"></div>`;
  for (const i of chat.items) appendItem(i, false);
}
function addUser(chat, prompt) {
  const item = { kind: "user", text: prompt };
  chat.items.push(item); appendItem(item); touch(chat);
}
function pushError(chat, e) {
  const d = e.detail;
  let msg = typeof d === "string" ? d : d?.message || e.message || "Something went wrong.";
  const extra = Array.isArray(d?.errors) ? d.errors.join("\n") : "";
  if (/credits|402/i.test(msg + extra)) msg += " Your OpenRouter account may be out of credits.";
  const item = { kind: "error", text: msg, extra };
  chat.items.push(item); appendItem(item); touch(chat);
}
async function preview() {
  const prompt = $("prompt").value.trim();
  if (!prompt || state.busy) return;
  if (!hasRouterKey()) return show("keys");
  const chat = ensureChat(prompt); openThread(chat);
  $("prompt").value = ""; grow();
  addUser(chat, prompt);
  busy(true, "Jev is choosing a model…");
  try {
    const route = await api("/api/route", { messages: [...chat.messages, { role: "user", content: prompt }], mode: state.mode });
    busy(false);
    const item = { kind: "preview", prompt, route };
    chat.items.push(item); appendItem(item); setRoute(route); touch(chat);
  } catch (e) { busy(false); pushError(chat, e); }
}
async function send(text, planned) {
  const prompt = (text ?? $("prompt").value).trim();
  if (!prompt || state.busy) return;
  if (!hasRouterKey()) return show("keys");
  const chat = ensureChat(prompt); openThread(chat);
  if (!planned) { $("prompt").value = ""; grow(); addUser(chat, prompt); }  // a preview already showed it
  const messages = [...chat.messages, { role: "user", content: prompt }];
  busy(true, planned ? `${modelName(planned.model_id)} is writing…` : "Choosing a model…");
  try {
    const body = { messages, mode: state.mode };
    if (planned) body.route = { model_id: planned.model_id, fallbacks: planned.fallbacks, confidence: planned.confidence, reason: planned.reason };
    const res = await api("/api/chat", body);
    busy(false);
    chat.messages = [...messages, { role: "assistant", content: res.answer }];
    const route = res.route || planned;
    const { route: _drop, ...rest } = res;
    const item = { kind: "answer", res: rest, route };
    chat.items.push(item); appendItem(item); setRoute(route); touch(chat);
    refreshCredit();
  } catch (e) { busy(false); pushError(chat, e); }
}

function renderUsage() {

function renderKeys() {

// ------------------------------------------------------------------ agent (spec 012)
// Everything shown comes from the server's view models: public summaries only, never hidden reasoning.
const agent = { config: null, taskId: null, view: null, events: [], seq: 0, stale: false, poll: 0, bodies: {}, draft: null, tasks: [] };
const STEP_LABEL = { pending: "Pending", running: "Running", waiting: "Waiting for you", verified: "Verified", failed: "Failed", canceled: "Canceled" };
const EVENT_LABEL = {
  status_changed: "Status", plan_created: "Plan ready", plan_revised: "Plan revised", plan_rejected: "Plan rejected",
  route_selected: "Model chosen", route_fallback: "Fallback", route_failed: "No model", permission_decided: "Permission",
  tool_called: "Tool", verification_completed: "Checked", retry_scheduled: "Retry", replan_started: "Replanning",
  approval_recorded: "Approved", task_finished: "Finished", diagnostic: "Note",
};
const QUIET_EVENTS = new Set(["task_created", "step_executed", "worker_completed"]);
const RUNNING = new Set(["created", "planning", "executing", "verifying", "replanning"]);
const statusClass = (s) => s === "done" ? "ok" : s === "failed" || s === "blocked" ? "bad" : s === "waiting_for_user" ? "req" : RUNNING.has(s) ? "run" : "";
const clock = (ts) => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const errText = (e, fallback) => typeof e.detail === "string" ? e.detail : fallback;

function statusPill(status, label) {
  return `<span class="pill status-pill ${statusClass(status)}">${RUNNING.has(status) ? '<span class="spin" aria-hidden="true"></span>' : ""}${esc(label)}</span>`;
}

async function renderAgent() {
  setRoute(null);
  if (!agent.config) {

}

async function loadTaskList() {
  try { agent.tasks = await api("/api/agent/tasks"); } catch { agent.tasks = []; }
  const el = $("agTasks"); if (!el) return;
  el.innerHTML = agent.tasks.length ? agent.tasks.map((t) => `
    <button class="row task-row" data-open="${esc(t.task_id)}">
      <div class="grow"><div class="title">${esc(t.objective)}</div><div class="sub mono">${esc(t.workspace)}</div></div>
      ${statusPill(t.status, t.status_label)}
    </button>`).join("") : `<div class="row sub">No tasks yet. Tasks are kept until the app closes.</div>`;
}

async function startTask(body) {
  body = body || {
    objective: $("agObjective").value.trim(), workspace: $("agWorkspace").value.trim(),
    context: $("agContext").value.trim(), budget_usd: parseFloat($("agBudget").value) || null,
  };
  const err = $("agError");
  if (!body.objective) { if (err) err.textContent = "Describe what should be done."; return $("agObjective")?.focus(); }
  if (!body.workspace) { if (err) err.textContent = "Choose a folder."; return $("agWorkspace")?.focus(); }
  const btn = $("agStart"); if (btn) btn.disabled = true;
  try {
    const view = await api("/api/agent/tasks", body);
    store.set("galliani.agent.workspace", body.workspace);
    if (body.budget_usd) store.set("galliani.agent.budget", String(body.budget_usd));
    agent.bodies[view.task_id] = body;
    openTask(view.task_id, view, true);
  } catch (e) {
    if (btn) btn.disabled = false;
    const msg = errText(e, "Could not start the task.");
    if (err) err.textContent = msg; else alert(msg);
  }
}

function openTask(id, view, fresh) {
  if (agent.taskId !== id || fresh) { agent.events = []; agent.seq = 0; }
  agent.taskId = id; agent.view = view || null; agent.stale = false;
  renderTask(); pollTask();
}

async function pollTask() {
  const token = ++agent.poll, id = agent.taskId;
  while (agent.poll === token && agent.taskId === id && state.view === "agent") {
    try {
      const page = await api(`/api/agent/tasks/${encodeURIComponent(id)}/events?after=${agent.seq}&wait=20`);
      if (agent.poll !== token || agent.taskId !== id) return;
      const before = agent.view;
      agent.events.push(...page.events); agent.seq = page.seq; agent.view = page.view; agent.stale = false;
      if (page.events.length || !before || before.status !== page.view.status || before.updated_at !== page.view.updated_at) renderTask();
      if (page.view.terminal) return;
    } catch {
      if (agent.poll !== token) return;
      agent.stale = true; renderTask(); return;  // 012: show the last known state and a retry option
    }
  }
}

function renderTask() {
  if (state.view !== "agent" || !agent.taskId) return;
  const v = agent.view;
  if (!v) { $("view").innerHTML = `<div class="page"><div class="thinking"><span class="spin"></span>Loading task…</div></div>`; return; }
  const draft = $("agAnswer")?.value, typing = document.activeElement?.id === "agAnswer";
  const prevPrompt = $("apCard")?.dataset.prompt, prevQuestion = $("qCard")?.dataset.q;
  const visible = agent.events.filter((e) => !QUIET_EVENTS.has(e.type));
  const latest = visible[visible.length - 1];

  $("view").innerHTML = `<div class="page wide">
    <div class="agent-head">
      <button class="icon-btn boxed" data-ag="back" title="All tasks" aria-label="Back to all tasks">${icon("i-back")}</button>
      <h2>${esc(v.objective_summary)}</h2>
      ${statusPill(v.status, v.status_label)}
    </div>
    <div class="sr-only" aria-live="polite">${latest ? esc(`${EVENT_LABEL[latest.type] || latest.type}: ${latest.public_summary}`) : ""}</div>
    ${agent.stale ? `<div class="stale" role="status">${icon("i-shield")}<span>Lost the connection to this task. Showing the last known state.</span>
      <button class="btn" data-ag="reconnect">Retry</button></div>` : ""}
    ${approvalHtml(v)}${questionHtml(v)}${resultHtml(v)}
    <div class="agent-grid">
      ${planHtml(v)}
      <section class="panel" aria-labelledby="actTitle"><div class="panel-head" id="actTitle">Activity</div>
        <ol class="feed" id="agFeed">${visible.slice(-80).map((e) => `
          <li><time datetime="${esc(e.timestamp)}">${clock(e.timestamp)}</time><span class="ev">${esc(EVENT_LABEL[e.type] || e.type)}</span>
          <span class="sum">${e.refs.step_id ? `<span class="mono">${esc(e.refs.step_id)}</span> · ` : ""}${esc(e.public_summary)}</span></li>`).join("")
          || `<li><span></span><span></span><span class="sum sub">Waiting for the first event…</span></li>`}</ol>
      </section>
    </div>
    <div class="memory-note">${icon("i-brain")}<span><strong>Memory:</strong> ${v.memory.records.length
      ? v.memory.records.map((m) => esc(m.summary)).join("; ") : esc(v.memory.note)}</span></div>
    ${usageLine(v)}
  </div>`;

  const feed = $("agFeed"); if (feed) feed.scrollTop = feed.scrollHeight;
  if (draft && $("agAnswer")) $("agAnswer").value = draft;
  if (typing) $("agAnswer")?.focus();
  else if (v.approval_prompt && prevPrompt !== v.approval_prompt.prompt_id) $("apTitle")?.focus();
  else if (v.clarification && prevQuestion !== v.clarification) $("agAnswer")?.focus();
}

function approvalHtml(v) {
  const p = v.approval_prompt; if (!p) return "";
  const action = (p.action_summary.match(/'([^']+)'/) || [])[1] || "this action";
  return `<section class="callout" id="apCard" data-prompt="${esc(p.prompt_id)}" role="alertdialog" aria-labelledby="apTitle" aria-describedby="apDesc">
    <h3 id="apTitle" tabindex="-1">${icon("i-shield")}Approval needed</h3>
    <p id="apDesc" style="margin:0">${esc(p.action_summary)}</p>
    <dl class="kv"><dt>Risk</dt><dd>${esc(p.risk_summary)}</dd><dt>Scope</dt><dd class="mono">${esc(p.scope)}</dd></dl>
    <div class="sub">The task is paused. Nothing happens until you choose.</div>
    <div class="actions">
      <button class="btn primary" data-ag="approve" aria-label="Approve ${esc(action)} for ${esc(p.scope)}">Approve</button>
      <button class="btn" data-ag="deny" aria-label="Deny ${esc(action)}">Deny</button>
      <button class="btn danger" data-ag="cancel">Cancel task</button>
    </div></section>`;
}

function questionHtml(v) {
  if (!v.clarification) return "";
  return `<section class="callout question" id="qCard" data-q="${esc(v.clarification)}" role="group" aria-labelledby="qTitle">
    <h3 id="qTitle">${icon("i-help")}Galliani needs an answer</h3>
    <label for="agAnswer" class="q">${esc(v.clarification)}</label>
    <textarea id="agAnswer" rows="2" placeholder="Your answer"></textarea>
    <div class="actions"><button class="btn primary" data-ag="clarify">Send answer</button>
      <button class="btn danger" data-ag="cancel">Cancel task</button></div></section>`;
}

function resultHtml(v) {
  const r = v.result; if (!r) return "";
  const ver = r.verification;
  const verif = ver ? `<div class="verif ${ver.status === "pass" ? "pass" : "fail"}">${icon(ver.status === "pass" ? "i-check" : "i-x")}
      <span>${ver.status === "pass" ? "Verified" : "Not verified"}: ${esc(ver.reason_summary)}</span></div>`
    : `<div class="verif none">${icon("i-x")}<span>Not verified, so the task was not marked done.</span></div>`;
  const json = r.output == null ? "" : `<pre class="mono">${esc(JSON.stringify(r.output, null, 2))}</pre>`;
  const out = r.output == null ? "" : r.output_kind === "text" ? `<div class="out body">${markdown(r.output)}</div>`
    : r.preview ? `<div class="out"><div class="body">${markdown(r.preview)}</div>
        <details style="margin-top:10px"><summary class="sub" style="cursor:pointer">Tool result</summary>${json}</details></div>`
    : `<div class="out">${json}</div>`;
  const files = r.artifacts.length ? `<div class="files"><strong>Files written</strong><ul>${r.artifacts.map((a) => `<li class="mono">${esc(a.uri)}</li>`).join("")}</ul></div>` : "";
  const next = v.status === "done"
    ? `<button class="btn" data-ag="new">New task</button>`
    : `<button class="btn primary" data-ag="retry">Try again</button><button class="btn" data-ag="edit">Edit and retry</button><button class="btn" data-ag="new">New task</button>`;
  const title = { done: "Result", blocked: "Blocked", failed: "Failed", canceled: "Canceled" }[r.status] || "Result";
  return `<section class="panel result" aria-labelledby="resTitle">
    <div class="row"><div class="grow"><div class="title" id="resTitle">${esc(title)}</div><div class="sub">${esc(r.summary)}</div></div></div>
    ${verif}${out}${files}<div class="next">${next}</div></section>`;
}

function planHtml(v) {
  const p = v.plan;
  if (!p) return `<section class="panel" aria-labelledby="planTitle"><div class="panel-head" id="planTitle">Plan</div>
    <div class="row sub">${RUNNING.has(v.status) ? '<span class="spin" aria-hidden="true"></span>Planning…' : "No plan was made."}</div></section>`;
  return `<section class="panel" aria-labelledby="planTitle">
    <div class="panel-head" id="planTitle">Plan <span class="sub">v${p.version} · ${p.steps.length} step${p.steps.length === 1 ? "" : "s"}</span></div>
    <ol class="steps">${p.steps.map((s) => `
      <li class="step ${s.state}"${s.step_id === v.current_step ? ' aria-current="step"' : ""}>
        <span class="st" role="img" aria-label="${STEP_LABEL[s.state]}">${s.state === "running" ? '<span class="spin"></span>'
          : { verified: "✓", failed: "✕", waiting: "❚❚", pending: "○", canceled: "–" }[s.state]}</span>
        <div><div class="title">${esc(s.purpose)}</div>
          <div class="sub">${s.kind === "tool" ? "Tool" : "Model"} · <span class="mono">${esc(s.capability)}</span>${s.attempts > 1 ? ` · ${s.attempts} attempts` : ""}</div></div>
      </li>`).join("")}</ol>
    ${p.revision_reason ? `<p class="revision">Revised: ${esc(p.revision_reason)}</p>` : ""}</section>`;
}

function usageLine(v) {
  const u = v.usage || {}; if (!u.calls) return "";
  const tokens = (u.input_tokens || 0) + (u.output_tokens || 0);
  return `<div class="usage-line">${u.calls} model call${u.calls === 1 ? "" : "s"} · ${tokens.toLocaleString()} tokens · est. ${money((u.cost_micro_usd || 0) / 1e6)}</div>`;
}

async function agentAct(action) {
  const id = agent.taskId;
  let body = {};
  if (action === "clarify") {
    const answer = $("agAnswer")?.value.trim();
    if (!answer) return $("agAnswer")?.focus();
    body = { answer };
  }
  document.querySelectorAll("[data-ag]").forEach((b) => (b.disabled = true));
  try {
    agent.view = await api(`/api/agent/tasks/${encodeURIComponent(id)}/${action}`, body);
    renderTask(); pollTask();
  } catch (e) {
    alert(errText(e, "That did not work. The task view will refresh."));
    renderTask(); pollTask();
  }
}

function retryBody(edit) {
  const known = agent.bodies[agent.taskId] || {};
  const listed = agent.tasks.find((t) => t.task_id === agent.taskId) || {};
  return { objective: known.objective || agent.view?.objective_summary || "", workspace: known.workspace || listed.workspace || "",
           context: known.context || "", budget_usd: known.budget_usd ?? null, edit };
}

$("view").addEventListener("click", (e) => {
  if (state.view !== "agent") return;
  const open = e.target.closest("[data-open]");
  if (open) return openTask(open.dataset.open, null, true);
  const b = e.target.closest("[data-ag]"); if (!b) return;
  const act = b.dataset.ag;
  if (act === "back" || act === "new") { agent.poll++; agent.taskId = null; agent.view = null; return renderAgent(); }
  if (act === "reconnect") { agent.stale = false; renderTask(); return pollTask(); }
  if (act === "retry") { const { edit, ...body } = retryBody(false); return startTask(body); }
  if (act === "edit") { agent.draft = retryBody(true); agent.poll++; agent.taskId = null; agent.view = null; return renderAgent(); }
  agentAct(act);
});

// ------------------------------------------------------------------ misc
function applyTheme(t) {
  store.set("galliani.theme", t === "system" ? null : t);
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = t;
}
async function refreshCredit() {
  if (!hasRouterKey()) { $("credit").textContent = "No key"; return; }
  try {
    const c = await api("/api/credits");
    const b = c.balance;
    $("credit").textContent = b == null ? "—" : `${b < 0 ? "-" : ""}$${Math.abs(b).toFixed(2)} credit`;
    $("credit").style.color = b != null && b < 0.5 ? "var(--warn)" : "";
  } catch { $("credit").textContent = "—"; }
}
function grow() { const t = $("prompt"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
$("prompt").addEventListener("input", grow);
$("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("sendBtn").addEventListener("click", () => send());
$("previewBtn").addEventListener("click", preview);
const narrow = () => innerWidth <= 760;
$("hideSidebar").addEventListener("click", () => { if (narrow()) return closeMobileSidebar(); $("app").classList.add("collapsed"); store.set("galliani.sidebar", "hidden"); });
$("showSidebar").addEventListener("click", () => { if (narrow()) return $("app").classList.add("open"); $("app").classList.remove("collapsed"); store.set("galliani.sidebar", null); });
function closeMobileSidebar() { $("app").classList.remove("open"); }

applyTheme(store.get("galliani.theme", "system"));
if (store.get("galliani.sidebar") === "hidden") $("app").classList.add("collapsed");
setMode(state.mode in MODES ? state.mode : "auto");
show("chat");
api("/api/config").then((cfg) => {
  state.config = cfg;
  $("keysWarn").hidden = hasRouterKey();
  refreshCredit();
  if (!hasRouterKey()) show("keys");
}).catch(() => {});
$("prompt").focus();
</script>
</body>
</html>
