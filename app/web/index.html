<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galliani</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
:root, :root[data-theme="dark"] {
  /* Graphite and silver, from the logo: the tile is #121318 and the G runs #f4f4f4 -> #cecfd0 -> #8e8e93. */
  --bg: #121318; --rail: #0e0f13; --surface: #18191e; --surface-2: #1f2026; --hover: #27282e;
  --border: #26272d; --border-strong: #35363d; --text: #f4f4f5; --muted: #a2a3aa; --faint: #6b6c74;
  --accent: #c9cacf; --primary-bg: #e4e4e6; --primary-fg: #121318;
  --primary-grad: linear-gradient(180deg, #f4f4f4, #cecfd0);
  --good: #4ade80; --warn: #fbbf24; --bad: #f87171; --bad-soft: rgba(248, 113, 113, .12);
  --agent: #5ec4b6; --agent-text: #0a1f1c; --code-bg: #0c0d10;
  --shadow: 0 1px 2px rgba(0,0,0,.35); --pop: 0 12px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f5f6; --rail: #ededef; --surface: #ffffff; --surface-2: #f2f2f4; --hover: #e7e7ea;
  --border: #e2e2e5; --border-strong: #cfcfd4; --text: #121318; --muted: #5c5d66; --faint: #95969e;
  --accent: #3d3e46; --primary-bg: #121318; --primary-fg: #ffffff;
  --primary-grad: linear-gradient(180deg, #2a2b31, #121318);
  --good: #16a34a; --warn: #b45309; --bad: #dc2626; --bad-soft: rgba(220, 38, 38, .08);
  --agent: #0f766e; --agent-text: #ffffff; --code-bg: #f4f4f6;
  --shadow: 0 1px 2px rgba(0,0,0,.05); --pop: 0 12px 40px rgba(0,0,0,.14);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f5f6; --rail: #ededef; --surface: #ffffff; --surface-2: #f2f2f4; --hover: #e7e7ea;
    --border: #e2e2e5; --border-strong: #cfcfd4; --text: #121318; --muted: #5c5d66; --faint: #95969e;
    --accent: #3d3e46; --primary-bg: #121318; --primary-fg: #ffffff;
    --primary-grad: linear-gradient(180deg, #2a2b31, #121318);
    --good: #16a34a; --warn: #b45309; --bad: #dc2626; --bad-soft: rgba(220, 38, 38, .08);
    --agent: #0f766e; --agent-text: #ffffff; --code-bg: #f4f4f6;
    --shadow: 0 1px 2px rgba(0,0,0,.05); --pop: 0 12px 40px rgba(0,0,0,.14);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace; font-variant-ligatures: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.logo { width: 32px; height: 32px; flex: none; display: block; }

/* ------------------------------------------------------------- shell: rail | drawer | main */
.app { display: grid; grid-template-columns: 64px auto 1fr; height: 100vh; }
.rail { background: var(--rail); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 0 0 14px; gap: 6px; min-height: 0; }
.rail-logo { height: 57px; width: 100%; display: grid; place-items: center; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.rail-nav { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.rail-btn { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); position: relative; }
.rail-btn:hover { background: var(--hover); color: var(--text); }
.rail-btn.active { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
.warn-dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.rail-credit { width: 44px; min-height: 44px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface-2); display: grid; place-items: center; font-size: 10.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail-credit:hover { color: var(--text); background: var(--hover); }

.drawer { width: 0; overflow: hidden; background: var(--rail); border-right: 0 solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.app.drawer-open .drawer { width: 272px; border-right-width: 1px; }
.drawer-head { height: 57px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--border); flex: none; }
.drawer-head h2 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; white-space: nowrap; }
.chats { flex: 1; overflow-y: auto; padding: 8px; min-width: 272px; }
.chat-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 9px; cursor: pointer; min-height: 40px; color: var(--muted); }
.chat-item:hover { background: var(--hover); color: var(--text); }
.chat-item.active { background: var(--surface-2); color: var(--text); }
.chat-item .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
.chat-item .when { color: var(--faint); font-size: 12px; white-space: nowrap; }
.chat-item .del { display: none; width: 24px; height: 24px; }
.chat-item:hover .when { display: none; }
.chat-item:hover .del { display: inline-grid; }
.chat-item .del:hover { color: var(--bad); }
.drawer-close { display: none; }
.no-chats { color: var(--faint); font-size: 13px; padding: 6px 10px; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar { height: 57px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--border); }
.topbar .brand-name { font-size: 18px; font-weight: 600; letter-spacing: -.01em; flex: 1; }
.icon-btn { width: 34px; height: 34px; border-radius: 9px; display: inline-grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn[aria-pressed="true"] { color: var(--text); background: var(--surface-2); }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }

.btn {
  height: 34px; padding: 0 13px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface-2);
  font-size: 13px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; text-decoration: none; color: var(--text);
}
.btn svg.i { width: 16px; height: 16px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--primary-grad), var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-fg); font-weight: 600; }
.btn.primary:hover { filter: brightness(.94); }
.btn.danger { color: var(--bad); }
.btn.stop { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, var(--border-strong)); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.btn:disabled { opacity: .5; cursor: default; }
.link-btn { color: var(--muted); font-size: 12.5px; }
.link-btn:hover { color: var(--text); text-decoration: underline; }
kbd { font: 11px/1 ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; color: var(--faint); border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 6px; }

.menu { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 6px; box-shadow: var(--pop); width: 300px; }
.menu button { width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: flex-start; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); }
.menu button.danger { color: var(--bad); }
.menu .mt { font-size: 13.5px; } .menu .ms { color: var(--muted); font-size: 12.5px; }
.menu .check { width: 16px; height: 16px; margin-top: 3px; color: var(--accent); flex: none; }
.menu.small { width: 220px; }
.menu.small button { align-items: center; font-size: 13.5px; }

/* ------------------------------------------------------------- conversation header + tabs */
.convo-head { flex: none; border-bottom: 1px solid var(--border); }
.convo-head .inner { max-width: 860px; margin: 0 auto; padding: 16px 24px 0; }
.task-head { display: flex; align-items: center; gap: 14px; }
.th-ic { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); flex: none; }
.th-ic svg.i { width: 20px; height: 20px; }
.th-main { flex: 1; min-width: 0; }
.th-title { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th-sub { font-size: 12.5px; color: var(--faint); display: flex; gap: 6px; flex-wrap: wrap; }
.tone-ok { color: var(--good); } .tone-run { color: var(--accent); } .tone-warn { color: var(--warn); }
.tone-bad { color: var(--bad); } .tone-mute { color: var(--muted); }
.tabs { display: flex; gap: 22px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.tabs button { padding: 8px 0 10px; color: var(--muted); font-size: 13.5px; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }
.tabs .count { font-size: 11px; color: var(--faint); background: var(--surface-2); border-radius: 999px; padding: 0 6px; }

/* ------------------------------------------------------------- main scroll area */
.scroll { flex: 1; overflow-y: auto; }
.thread { max-width: 860px; margin: 0 auto; padding: 20px 24px 12px; }
.page { max-width: 780px; margin: 0 auto; padding: 28px 24px 40px; }
.page h2 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
.page .lead { color: var(--muted); margin: 0 0 22px; }
.tabpage { max-width: 860px; padding-top: 20px; }

/* home */
.home { max-width: 620px; margin: 0 auto; padding: 7vh 24px 40px; }
.hero { text-align: center; margin-bottom: 26px; }
.hero h1 { font-size: clamp(24px, 3.4vw, 30px); margin: 0 0 8px; font-weight: 600; letter-spacing: -.02em; }
.hero p { color: var(--muted); margin: 0 auto; max-width: 440px; font-size: 14px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
.suggest button, .next button { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 6px 11px; font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 7px; align-items: center; text-align: left; }
.suggest button:hover, .next button:hover { color: var(--text); border-color: var(--border-strong); background: var(--hover); }
.suggest svg.i { width: 15px; height: 15px; }
.sec-head { display: flex; align-items: baseline; margin: 34px 0 10px; }
.sec-head h2 { font-size: 14.5px; font-weight: 600; margin: 0; flex: 1; }
.rows { display: grid; gap: 8px; }
.task-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; text-align: left; }
.task-row:hover { border-color: var(--border-strong); background: var(--hover); }
.tr-ic { width: 34px; height: 34px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); flex: none; }
.tr-ic svg.i { width: 17px; height: 17px; }
.tr-main { flex: 1; min-width: 0; display: grid; }
.tr-title { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-sub { font-size: 12px; color: var(--faint); }
.tr-del { width: 28px; height: 28px; }
.tr-del:hover { color: var(--bad); }
.state-ic { width: 22px; height: 22px; display: grid; place-items: center; flex: none; }
.state-ic svg.i { width: 20px; height: 20px; }
.state-ic.ok { color: var(--good); } .state-ic.bad { color: var(--bad); } .state-ic.warn { color: var(--warn); } .state-ic.mute { color: var(--faint); }
.ring { width: 17px; height: 17px; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
.empty-rows { color: var(--faint); font-size: 13px; padding: 14px; border: 1px dashed var(--border); border-radius: 12px; text-align: center; }
.stats-strip { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); background: var(--surface); border-radius: 12px; margin-top: 24px; }
.stats-strip button { padding: 12px 16px; text-align: left; display: grid; gap: 2px; }
.stats-strip button + button { border-left: 1px solid var(--border); }
.stats-strip button:hover { background: var(--hover); }
.stats-strip button:first-child { border-radius: 12px 0 0 12px; } .stats-strip button:last-child { border-radius: 0 12px 12px 0; }
.stats-strip .k { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.stats-strip .k svg.i { width: 13px; height: 13px; margin-left: auto; color: var(--faint); }
.stats-strip .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* messages */
.msg { margin: 0 0 18px; }
.msg.user { display: flex; justify-content: flex-end; }
.bubble { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px 14px 4px 14px; padding: 9px 14px; max-width: min(640px, 90%); white-space: pre-wrap; overflow-wrap: anywhere; }
.answer { overflow-wrap: anywhere; }
.body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
.body p { margin: 0 0 .85em; }
.body h1, .body h2, .body h3, .body h4 { margin: 1.1em 0 .5em; line-height: 1.3; }
.body h1 { font-size: 1.3em; } .body h2 { font-size: 1.15em; } .body h3, .body h4 { font-size: 1.02em; }
.body ul, .body ol { margin: 0 0 .85em; padding-left: 1.4em; }
.body li { margin: .2em 0; }
.body code { font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; font-variant-ligatures: none; font-size: .88em; background: var(--surface-2); padding: .12em .38em; border-radius: 5px; }
.body pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 0 0 .9em; }
.body pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
.body a { color: var(--accent); }
.body blockquote { margin: 0 0 .85em; padding-left: 12px; border-left: 3px solid var(--border-strong); color: var(--muted); }
.code-fold { border: 1px solid var(--border); border-radius: 10px; margin: 0 0 .9em; background: var(--surface-2); }
.code-fold > summary { cursor: pointer; padding: 7px 12px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; list-style: none; }
.code-fold > summary::-webkit-details-marker { display: none; }
.code-fold > summary:hover { color: var(--text); }
.code-fold > summary svg.i { width: 15px; height: 15px; }
.code-fold[open] > summary { border-bottom: 1px solid var(--border); }
.code-fold pre { margin: 0; border: 0; border-radius: 0 0 10px 10px; max-height: 420px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 10px; color: var(--muted); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px 3px 8px; color: var(--text); font-weight: 500; background: var(--surface); font-size: 12.5px; }
.chip:hover { border-color: var(--border-strong); }
.chip[aria-expanded="true"] { border-color: var(--border-strong); background: var(--surface-2); }
.saved { color: var(--good); }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(251,191,36,.14); color: var(--warn); }
.vendor { width: 14px; height: 14px; flex: none; }
.copy-btn { color: var(--faint); display: inline-flex; }
.copy-btn:hover { color: var(--text); }
.copy-btn svg.i { width: 16px; height: 16px; }
.card { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 16px 18px; }
.card + .card { margin-top: 12px; }
.card > h3 { font-size: 14px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.route-inline { margin-top: 10px; font-size: 13px; }
.why-text { margin: 0 0 12px; color: var(--muted); }
.why-text strong { color: var(--text); }
.options { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.options td { padding: 4px 0; vertical-align: middle; }
.options td.n { width: 38%; padding-right: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; color: var(--muted); }
.options tr.picked td.n { color: var(--text); font-weight: 600; }
.options td.c { width: 80px; text-align: right; color: var(--muted); padding-left: 12px; }
.track { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
.fill { height: 100%; border-radius: 3px; background: var(--faint); }
tr.picked .fill { background: var(--accent); }
.tag { font-size: 11px; color: var(--faint); margin-left: 6px; font-weight: 400; }
.conf-good { color: var(--good); } .conf-warn { color: var(--warn); } .conf-bad { color: var(--bad); }
.preview .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.preview .actions { display: flex; gap: 8px; margin-top: 14px; }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 4px 2px; }
.spin { width: 14px; height: 14px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin, .ring { animation-duration: 2.4s; } }
.error { border: 1px solid rgba(248,113,113,.35); background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 12px 16px; }
.error pre { white-space: pre-wrap; font-size: 12px; margin: 8px 0 0; }

/* ------------------------------------------------------------- agent task (specs 012, 010, 014) */
.task { display: grid; gap: 12px; min-width: 0; }
.progress { list-style: none; margin: 0; padding: 0; }
.pstep { display: flex; gap: 12px; align-items: flex-start; position: relative; padding: 0 0 16px; }
.pstep:last-child { padding-bottom: 0; }
.pstep:not(:last-child)::after { content: ""; position: absolute; left: 10px; top: 25px; bottom: 3px; border-left: 1px dashed var(--border-strong); }
.pstep.verified:not(:last-child)::after { border-left: 1px solid color-mix(in srgb, var(--good) 45%, var(--border-strong)); }
.pnode { width: 21px; height: 21px; display: grid; place-items: center; color: var(--faint); flex: none; margin-top: 1px; }
.pnode svg.i { width: 17px; height: 17px; }
.pstep.verified .pnode { color: var(--good); }
.pstep.running .pnode, .pstep[aria-current="step"] .pnode { color: var(--accent); }
.pstep.waiting .pnode { color: var(--warn); } .pstep.failed .pnode { color: var(--bad); }
.pbody { flex: 1; min-width: 0; }
.ptitle { font-size: 13.5px; }
.psub { font-size: 12.5px; color: var(--faint); overflow-wrap: anywhere; }
.pstep.pending .ptitle, .pstep.canceled .ptitle { color: var(--muted); }
.pstate { width: 22px; height: 22px; display: grid; place-items: center; flex: none; }
.pstate svg.i { width: 20px; height: 20px; }
.pstep.verified .pstate { color: var(--good); } .pstep.failed .pstate { color: var(--bad); } .pstep.waiting .pstate { color: var(--warn); }
.pstep.pending .pstate, .pstep.canceled .pstate { color: var(--faint); }
.revision { margin: 12px 0 0; color: var(--muted); font-size: 12.5px; }
.mt-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; }
.mt-k { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.mt-model { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.mt-model svg { width: 16px; height: 16px; }
.tool-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tool-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; font-size: 12.5px; background: var(--surface-2); }
.tool-chip svg.i { width: 14px; height: 14px; color: var(--muted); }
.tool-chip.on { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.tool-chip.on svg.i { color: var(--accent); }
.edit-badge { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; color: var(--agent); border: 1px solid color-mix(in srgb, var(--agent) 40%, transparent); background: color-mix(in srgb, var(--agent) 9%, transparent); white-space: nowrap; font-weight: 400; }
.card-h-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.final .lead-line { margin: 0 0 12px; }
.final .lead-line.fail { color: var(--muted); }
.clamp { max-height: 300px; overflow: hidden; position: relative; }
.clamp::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(transparent, var(--surface)); pointer-events: none; }
.clamp.open { max-height: none; }
.clamp.open::after, .clamp.fits::after { display: none; }
.result-body { border: 1px solid var(--border); background: var(--bg); border-radius: 12px; padding: 14px 16px; margin: 0 0 12px; overflow-wrap: anywhere; }
.result-body .clamp::after { background: linear-gradient(transparent, var(--bg)); }
.more-btn { margin-top: 8px; }
.file-cards { display: grid; gap: 8px; margin: 0 0 12px; }
.file-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 11px; min-width: 0; }
.file-card .fc-ic { width: 32px; height: 38px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); flex: none; }
.file-card .fc-main { flex: 1; min-width: 0; }
.file-card .fc-name { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-card .fc-sub { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fc-sub .over { color: var(--warn); }
.verif { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; margin: 0 0 10px; }
.verif svg.i { width: 16px; height: 16px; margin-top: 1px; }
.verif.pass { color: var(--good); } .verif.fail { color: var(--bad); } .verif.none { color: var(--muted); }
.tc-memory { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.tc-memory > div { display: flex; gap: 8px; align-items: flex-start; }
.tc-memory svg.i { width: 15px; height: 15px; color: var(--agent); margin-top: 2px; }
.tc-memory .note { color: var(--faint); }
.final-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }
.final-foot .grow { flex: 1; }
.usage-line { color: var(--faint); font-size: 12px; }
.next-wrap { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
.next-wrap .k { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.next { display: flex; gap: 8px; flex-wrap: wrap; }
.next .btn { height: 32px; }
.callout { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border)); background: color-mix(in srgb, var(--warn) 7%, var(--surface)); border-radius: 14px; padding: 14px 16px; }
.callout.question { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.callout h3 { margin: 0 0 6px; font-size: 14.5px; display: flex; gap: 8px; align-items: center; }
.callout h3:focus { outline: none; }
.callout h3:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.callout .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.callout textarea { width: 100%; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--bg); padding: 9px 12px; margin-top: 8px; resize: vertical; }
.callout .q { display: block; font-size: 14px; }
.callout .sub { color: var(--muted); font-size: 12.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.stale { display: flex; align-items: center; gap: 10px; border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border)); border-radius: 10px; padding: 8px 12px; color: var(--warn); font-size: 13px; }
.stale span { flex: 1; }
.feed { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.feed li { display: grid; grid-template-columns: 62px 104px 1fr; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--border); }
.feed li:last-child { border-bottom: 0; }
.feed time { color: var(--faint); font-variant-numeric: tabular-nums; }
.feed .ev { color: var(--muted); }
.feed .sum { overflow-wrap: anywhere; }
.task-label { font-size: 12.5px; color: var(--faint); margin: 22px 0 8px; display: flex; gap: 8px; align-items: center; }
.task-label:first-child { margin-top: 0; }
.task-label .obj { color: var(--text); font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.raw { margin-top: 10px; }
.raw > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; width: fit-content; }
.raw pre { white-space: pre-wrap; font-size: 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 8px 0 0; max-height: 360px; overflow: auto; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); font-weight: 500; white-space: nowrap; }
.pill.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.pill.req { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: var(--bad-soft); }
.pill.run { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }

/* ------------------------------------------------------------- composer */
.composer { padding: 10px 24px 18px; flex: none; }
.box { max-width: 812px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 16px; padding: 12px 12px 10px 16px; box-shadow: var(--shadow); }
.home .box { max-width: none; padding: 16px 14px 12px 18px; }
.home .box textarea { min-height: 52px; }
.box:focus-within { border-color: color-mix(in srgb, var(--text) 30%, var(--border-strong)); }
.box textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; padding: 2px 0 10px; min-height: 26px; max-height: 38vh; line-height: 1.5; font-size: 14.5px; }
.box textarea:focus-visible { outline: none; }
.box textarea::placeholder { color: var(--faint); }
.tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tools .spacer { flex: 1; }
.tool { height: 30px; padding: 0 10px; border-radius: 8px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; border: 1px solid var(--border); }
.tool svg.i { width: 15px; height: 15px; }
.tool:hover { background: var(--hover); color: var(--text); }
.tool:disabled { opacity: .45; cursor: default; background: none; }
.mode-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.mode-seg button { height: 24px; padding: 0 9px; border-radius: 6px; font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.mode-seg button svg.i { width: 14px; height: 14px; }
.mode-seg button:hover:not(:disabled) { color: var(--text); }
.mode-seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }
.mode-seg button:disabled { opacity: .45; cursor: default; }
.folder-chip { max-width: 220px; }
.folder-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-chip svg.i { color: var(--agent); }
.folder-menu { padding: 14px; display: grid; gap: 8px; }
.folder-menu input { height: 36px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--bg); padding: 0 10px; width: 100%; }
.folder-menu .sub { color: var(--muted); font-size: 12.5px; }
.fp-actions { display: flex; gap: 8px; }
/* accept-edits toggle (spec 014): off = ask before each write, on = teal and filled */
.edit-toggle[aria-pressed="true"] { color: var(--agent-text); background: var(--agent); border-color: var(--agent); }
.edit-toggle[aria-pressed="true"]:hover { filter: brightness(1.08); }
.send { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-grad), var(--primary-bg); color: var(--primary-fg); }
.send:hover { filter: brightness(.92); }
.send:disabled { opacity: .4; cursor: default; }
.send svg.i { width: 18px; height: 18px; stroke-width: 2.2; }

/* ------------------------------------------------------------- pages */
.panel { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; margin-bottom: 14px; }
.panel .row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
.panel .row + .row { border-top: 1px solid var(--border); }
.panel .grow { flex: 1; min-width: 0; }
.panel .title { font-weight: 550; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; overflow-wrap: anywhere; }
.panel .sub, .sub { color: var(--muted); font-size: 13px; }
.price { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.key-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 16px 18px; }
.key-row + .key-row { border-top: 1px solid var(--border); }
.key-row .head { display: flex; align-items: center; gap: 8px; font-weight: 550; grid-column: 1 / -1; }
.key-row .note { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin-top: -4px; }
.key-row input, .num-input, .search-input { height: 36px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--bg); padding: 0 12px; font-size: 13px; width: 100%; min-width: 0; }
.key-row input { font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }
.num-input { width: 96px; }
.search-input { margin-bottom: 14px; }
.key-row .btns { display: flex; gap: 8px; }
.link { color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
.stat { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 16px 18px; }
.stat .k { color: var(--muted); font-size: 12.5px; }
.stat .v { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; border: 1px solid var(--border); flex-wrap: wrap; }
.seg button { padding: 5px 12px; border-radius: 8px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.foot-note { color: var(--faint); font-size: 12.5px; margin-top: 10px; }
.field { display: grid; gap: 6px; }
.field > span { font-weight: 550; font-size: 13.5px; }
.field textarea, .field input, .field select { border: 1px solid var(--border-strong); border-radius: 9px; background: var(--bg); padding: 9px 12px; width: 100%; min-width: 0; resize: vertical; }
.field input, .field select { height: 38px; padding: 0 12px; }
.form-foot { display: flex; align-items: center; gap: 12px; }
.form-error { color: var(--bad); font-size: 13px; flex: 1; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--muted); }
.mem-form { padding: 16px 18px; display: grid; gap: 12px; margin-bottom: 14px; }
.mem-opts { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.mem-opts .field { min-width: 180px; }
.agent-ic { color: var(--agent); }

@media (max-width: 760px) {
  .app { grid-template-columns: 56px 1fr; }
  .rail-btn { width: 38px; height: 38px; }
  .drawer { position: fixed; inset: 0 auto 0 56px; z-index: 30; width: 0; }
  .app.drawer-open .drawer { width: 272px; box-shadow: var(--pop); }
  .thread, .composer, .page, .home, .convo-head .inner { padding-left: 16px; padding-right: 16px; }
  .home { padding-top: 4vh; }
  .stats, .mt-grid { grid-template-columns: 1fr; }
  .stats-strip .v { font-size: 17px; }
  .stats-strip button { padding: 10px 12px; }
  .feed li { grid-template-columns: 56px 1fr; }
  .feed .ev { display: none; }
  .tabs { gap: 16px; }
  .composer kbd { display: none; }
  .drawer-close { display: inline-grid; }
  .btn-text { display: none; }
}
</style>

          <div class="mode-seg" id="modeSeg" role="group" aria-label="Conversation type">
            <button type="button" data-mode="chat" aria-pressed="true"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>Chat</button>
            <button type="button" data-mode="agent" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-agent"/></svg>Agent</button>
          </div>
          <button class="tool" id="modeTool" title="Routing mode" aria-haspopup="menu"><svg class="i"><use href="#i-sliders"/></svg><span id="modeToolLabel">Auto</span></button>
          <button class="tool" id="previewBtn" title="See which model Jev picks, without generating an answer"><svg class="i"><use href="#i-eye"/></svg>Preview</button>
          <button class="tool folder-chip" id="folderChip" hidden aria-haspopup="dialog"><svg class="i" aria-hidden="true"><use href="#i-folder"/></svg><span id="folderLabel">Choose folder</span></button>
          <button class="tool edit-toggle" id="editToggle" hidden aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-edits"/></svg><span id="editLabel">Ask before edits</span></button>

          <kbd title="Enter to send · Shift+Enter for a new line">Enter</kbd>

</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k, fallback = null) { try { const v = localStorage.getItem(k); return v === null ? fallback : v; } catch { return fallback; } },
  set(k, v) { try { v === null || v === "" ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  json(k, fallback) { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } },
  setJson(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const APP_TOKEN = new URLSearchParams(location.search).get("token");
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform);
const MODES = {
  auto: ["Auto (Galliani Router)", "Choose the best model for your task", "Auto"],
  cheapest: ["Cheapest", "Lowest price that still does the job", "Cheapest"],
  fastest: ["Fastest", "Quickest model that still does the job", "Fastest"],
  best: ["Best quality", "Most capable model, regardless of price", "Best"],
};
const SUGGESTIONS = [
  ["i-file", "", "Summarize a text", "Summarize the following text and list the key takeaways:\n\n"],
  ["i-code", "", "Write a CSV parser in Python", "Write a function in Python to parse a CSV file"],
  ["i-lang", "", "Translate a message", "Translate into English: "],
  ["i-bulb", "", "Explain like I'm five", "Explain like I'm five: "],
];
// id, label, required, note, where to get a key, request header (web mode)
const PROVIDERS = [
  ["openrouter", "OpenRouter", true, "Runs Jev and every model.", "https://openrouter.ai/settings/keys", "X-OpenRouter-Key"],
  ["anthropic", "Anthropic", false, "Claude models run on your Anthropic account instead.", "https://console.anthropic.com/settings/keys", "X-Anthropic-Key"],
  ["openai", "OpenAI", false, "GPT models run on your OpenAI account instead.", "https://platform.openai.com/api-keys", "X-OpenAI-Key"],
];
const PROVIDER_LABEL = { openrouter: "OpenRouter", anthropic: "Anthropic", openai: "OpenAI" };

const state = {
  chats: store.json("galliani.chats", []),
  currentId: null,
  mode: store.get("galliani.mode", "auto"),
  composeMode: store.get("galliani.composeMode", "chat") === "agent" ? "agent" : "chat",  // for new conversations
  config: null,
  view: "chat",
  tab: "overview",  // tab of the open conversation
  busy: false,
};

// ------------------------------------------------------------------ formatting
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function modelName(id) {
  return id.split("/").pop().split("-").map((p) => p === "gpt" ? "GPT" : /^\d/.test(p) ? p : p[0].toUpperCase() + p.slice(1))
    .join(" ").replace(/^GPT (\d)/, "GPT-$1");
}
const vendor = (id) => id.split("/")[0];
const KNOWN_VENDORS = new Set(["anthropic", "google", "openai"]);
const vendorIcon = (id) => KNOWN_VENDORS.has(vendor(id)) ? `<svg class="vendor" aria-hidden="true"><use href="#v-${esc(vendor(id))}"/></svg>` : icon("i-spark");
const icon = (id, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
function money(x) {
  if (x == null) return "—";
  if (x === 0) return "$0";
  if (x < 0.0001) return "<$0.0001";
  if (x < 0.01) return "$" + x.toFixed(4);
  return "$" + x.toFixed(x < 1 ? 3 : 2);
}
function ago(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 172800) return "Yesterday";
  return Math.floor(s / 86400) + " days ago";
}
function duration(ms) {
  if (!(ms >= 0)) return "";
  const s = Math.round(ms / 1000);
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor(s / 60) % 60}m`;
}
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const confClass = (c) => c >= 0.9 ? "conf-good" : c >= 0.7 ? "conf-warn" : "conf-bad";

// Small, safe markdown: HTML is escaped first, then a few constructs are rendered. With `foldCode`, code
// blocks become collapsed "Code · N lines" rows, so a finished task never dumps a whole program on screen.
function markdown(src, { foldCode = false } = {}) {
  const blocks = [];
  let text = String(src).replace(/```([\w+-]*)[^\n]*\n([\s\S]*?)```/g, (_, lang, code) => {
    code = code.replace(/\n$/, "");
    const pre = `<pre><code>${esc(code)}</code></pre>`;
    const lines = code.split("\n").length;
    blocks.push(foldCode
      ? `<details class="code-fold"><summary>${icon("i-code")}${esc(lang || "Code")} · ${plural(lines, "line")}</summary>${pre}</details>`
      : pre);
    return `\u0000${blocks.length - 1}\u0000`;
  });
  text = esc(text);
  const inline = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = []; let list = null, para = [];
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join("<br>"))}</p>`); para = []; } };
  for (const line of text.split("\n")) {
    const block = line.match(/^\u0000(\d+)\u0000$/), h = line.match(/^(#{1,4})\s+(.*)$/);
    const ul = line.match(/^\s*[-*•]\s+(.*)$/), ol = line.match(/^\s*\d+[.)]\s+(.*)$/), q = line.match(/^&gt;\s?(.*)$/);
    if (block) { flush(); closeList(); out.push(blocks[+block[1]]); }
    else if (h) { flush(); closeList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); }
    else if (ul || ol) { flush(); const k = ul ? "ul" : "ol"; if (list !== k) { closeList(); out.push(`<${k}>`); list = k; } out.push(`<li>${inline((ul || ol)[1])}</li>`); }
    else if (q) { flush(); closeList(); out.push(`<blockquote>${inline(q[1])}</blockquote>`); }
    else if (!line.trim()) { flush(); closeList(); }
    else { closeList(); para.push(line); }
  }
  flush(); closeList();
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}

// ------------------------------------------------------------------ API
function keyHeaders() {
  if (state.config?.desktop) return {};  // desktop: keys live in the OS credential store, server-side
  const h = {};
  for (const [id, , , , , header] of PROVIDERS) { const k = store.get(`galliani.key.${id}`); if (k) h[header] = k; }
  return h;
}
async function api(path, body, method) {
  const headers = { "Content-Type": "application/json", ...keyHeaders() };
  if (APP_TOKEN) headers["X-App-Token"] = APP_TOKEN;
  const res = await fetch(path, { method: method || (body ? "POST" : "GET"), headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(res.statusText), { status: res.status, detail: data.detail });
  return data;
}
function keyStatus(id) {
  const c = state.config; if (!c) return "none";
  const k = c.keys?.[id] || {};
  if (c.desktop ? k.saved : store.get(`galliani.key.${id}`)) return "saved";
  return k.env ? "env" : "none";
}
const hasRouterKey = () => keyStatus("openrouter") !== "none";

// ------------------------------------------------------------------ conversations
function saveChats() { store.setJson("galliani.chats", state.chats.slice(0, 200)); }
const currentChat = () => state.chats.find((c) => c.id === state.currentId) || null;
function ensureChat(firstPrompt) {
  let chat = currentChat();
  if (!chat) {
    chat = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
             title: firstPrompt.trim().split("\n")[0].slice(0, 60) || "New chat",
             updated: Date.now(), messages: [], items: [], kind: state.composeMode };
    state.chats.unshift(chat);
    state.currentId = chat.id;
  }
  return chat;
}
function touch(chat) {
  chat.updated = Date.now();
  state.chats = [chat, ...state.chats.filter((c) => c.id !== chat.id)];
  saveChats(); renderChatList();
}
function deleteChat(id) {
  state.chats = state.chats.filter((c) => c.id !== id);
  if (state.currentId === id) state.currentId = null;
  saveChats();
  show(state.view === "history" ? "history" : "chat");
}
function openChat(id) { state.currentId = id; state.tab = "overview"; show("chat"); closeNarrowDrawer(); }

const lastTask = (chat) => [...(chat?.items || [])].reverse().find((i) => i.kind === "task") || null;
// One summary of a conversation's state, shared by the drawer, the home list, history and the header.
function convState(chat) {
  if (chatKind(chat) !== "agent") {
    const n = chat.items.filter((i) => i.kind === "answer").length;
    return { tone: "mute", label: n ? plural(n, "answer") : "Chat", ic: "" };
  }
  const t = lastTask(chat), v = t?.view;
  if (!v) return { tone: "mute", label: chat.items.some((i) => i.kind === "error") ? "Not started" : "Starting", ic: "" };
  if (t.lost && !v.terminal) return { tone: "mute", label: "Stopped", ic: "dash" };
  if (v.status === "done") return { tone: "ok", label: "Completed", ic: "ok" };
  if (v.status === "waiting_for_user") return { tone: "warn", label: v.status_label, ic: "warn" };
  if (v.status === "canceled") return { tone: "mute", label: v.status_label, ic: "dash" };
  if (v.terminal) return { tone: "bad", label: v.status_label, ic: "bad" };
  return { tone: "run", label: "In progress", ic: "run" };
}
function stateIcon(st) {
  if (st.ic === "run") return `<span class="state-ic" role="img" aria-label="${esc(st.label)}"><span class="ring"></span></span>`;
  const ic = { ok: "i-check-c", bad: "i-x-c", warn: "i-pause-c", dash: "i-dash-c" }[st.ic];
  return ic ? `<span class="state-ic ${st.ic === "dash" ? "mute" : st.ic}" role="img" aria-label="${esc(st.label)}">${icon(ic)}</span>` : "";
}
function convRow(chat, { removable = false } = {}) {
  const st = convState(chat), isAgent = chatKind(chat) === "agent";
  return `<div class="task-row" role="button" tabindex="0" data-open="${esc(chat.id)}">
    <span class="tr-ic">${icon(isAgent ? "i-file" : "i-chat")}</span>
    <span class="tr-main"><span class="tr-title">${esc(chat.title)}</span><span class="tr-sub">${isAgent ? "" : "Chat · "}${esc(st.label)} · ${ago(chat.updated)}</span></span>
    ${stateIcon(st)}
    ${removable ? `<button class="icon-btn tr-del" data-del="${esc(chat.id)}" title="Delete conversation" aria-label="Delete ${esc(chat.title)}">${icon("i-trash")}</button>` : ""}
  </div>`;
}
function renderChatList() {
  const list = $("chatList");
  if (!state.chats.length) { list.innerHTML = `<div class="no-chats">No conversations yet</div>`; return; }
  list.innerHTML = state.chats.map((c) => `
    <div class="chat-item ${c.id === state.currentId && state.view === "chat" ? "active" : ""}" role="button" tabindex="0" data-id="${c.id}">
      ${chatKind(c) === "agent" ? icon("i-agent", "agent-ic") : icon("i-chat")}<span class="t">${esc(c.title)}</span><span class="when">${ago(c.updated)}</span>
      <button class="del icon-btn" data-del="${c.id}" title="Delete conversation" aria-label="Delete conversation">${icon("i-x")}</button>
    </div>`).join("");
}
$("chatList").addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]");
  if (del) { e.stopPropagation(); return deleteChat(del.dataset.del); }
  const item = e.target.closest(".chat-item");
  if (item) openChat(item.dataset.id);
});
$("chatList").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.classList.contains("chat-item")) e.target.click(); });
function newChat() { state.currentId = null; state.tab = "overview"; agent.editModes.delete(""); show("chat"); $("prompt").focus(); closeNarrowDrawer(); }
$("newChat").addEventListener("click", newChat);
$("drawerNew").addEventListener("click", newChat);
$("newChat").title = `New conversation (${IS_MAC ? "⌘ N" : "Ctrl N"})`;
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "n") { e.preventDefault(); newChat(); }
  if (e.key === "Escape") closeMenu();
});

// ------------------------------------------------------------------ routing details (chat)
function taskLabel(r) { const t = r.task_type ? r.task_type.replace("_", " ") : "general task"; return t[0].toUpperCase() + t.slice(1); }
function shortReason(r) {
  if (r.router_error) return "Jev unavailable: safe default";
  return r.escalated ? `${taskLabel(r)}: switched from ${modelName(r.first_choice)}` : `${taskLabel(r)}: best value for this task`;
}
function longReason(r) {
  if (r.router_error) return "Jev couldn't be reached, so the request went to a capable default.";
  const words = { reasoning: "reasoning", coding: "coding", writing: "writing", knowledge: "specialist knowledge", precision: "exactness" };
  const strong = Object.entries(r.signals || {}).filter(([, v]) => v >= 0.6).sort((a, b) => b[1] - a[1]).map(([k]) => words[k]);
  const needs = strong.length ? ` that needs strong ${strong.slice(0, 2).join(" and ")}` : "";
  const what = `${esc(taskLabel(r))}${needs}.`;
  return r.escalated
    ? `${what} Jev's first choice was ${esc(modelName(r.first_choice))}, but at ${Math.round(r.confidence * 100)}% confidence it switched to the more capable <strong>${esc(modelName(r.model_id))}</strong>.`
    : `${what} <strong>${esc(modelName(r.model_id))}</strong> is the cheapest model likely to do it well.`;
}
function detailsHtml(r) {
  const top = Math.max(...(r.options || []).map((o) => o.score), 0.0001);
  const rows = (r.options || []).map((o) => `
    <tr class="${o.model_id === r.model_id ? "picked" : ""}">
      <td class="n">${esc(modelName(o.model_id))}${r.escalated && o.model_id === r.first_choice ? '<span class="tag">first choice</span>' : ""}</td>
      <td><div class="track"><div class="fill" style="width:${Math.max(2, o.score / top * 100).toFixed(0)}%"></div></div></td>
      <td class="c">~${money(o.est_cost)}</td>
    </tr>`).join("");
  const tech = `${r.reason} · routing ${money(r.router_cost)}, ${Math.round(r.router_ms)} ms`;
  return `<p class="why-text" title="${esc(tech)}">${longReason(r)}</p>${rows ? `<table class="options" aria-label="Jev's preference and estimated cost per model">${rows}</table>` : ""}`;
}

// ------------------------------------------------------------------ menus
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; $("moreBtn").setAttribute("aria-expanded", "false"); }
function placeMenu(anchor, above) {
  document.body.appendChild(menuEl);
  const r = anchor.getBoundingClientRect();
  menuEl.style.left = Math.max(12, Math.min(r.left, innerWidth - menuEl.offsetWidth - 12)) + "px";
  menuEl.style.top = Math.max(12, above ? r.top - menuEl.offsetHeight - 8 : r.bottom + 8) + "px";
}
function openModeMenu(anchor) {
  closeMenu();
  menuEl = document.createElement("div");
  menuEl.className = "menu"; menuEl.setAttribute("role", "menu");
  menuEl.innerHTML = Object.entries(MODES).map(([id, [title, sub]]) => `
    <button role="menuitemradio" aria-checked="${id === state.mode}" data-mode="${id}">
      <span class="check">${id === state.mode ? icon("i-check") : ""}</span>
      <span><div class="mt">${esc(title)}</div><div class="ms">${esc(sub)}</div></span>
    </button>`).join("");
  placeMenu(anchor, true);
  menuEl.addEventListener("click", (e) => { const b = e.target.closest("[data-mode]"); if (b) { setMode(b.dataset.mode); closeMenu(); } });
  menuEl.querySelector('[aria-checked="true"]')?.focus();
}
function setMode(m) { state.mode = m; store.set("galliani.mode", m); $("modeToolLabel").textContent = MODES[m][2]; }
$("modeTool").addEventListener("click", (e) => { e.stopPropagation(); menuEl ? closeMenu() : openModeMenu($("modeTool")); });
$("moreBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  if (menuEl) return closeMenu();
  const chat = currentChat(); if (!chat) return;
  menuEl = document.createElement("div");
  menuEl.className = "menu small"; menuEl.setAttribute("role", "menu");
  menuEl.innerHTML = `<button role="menuitem" data-m="new">${icon("i-compose")}New conversation</button>
    <button role="menuitem" data-m="copy">${icon("i-copy")}Copy result</button>
    <button role="menuitem" class="danger" data-m="delete">${icon("i-trash")}Delete conversation</button>`;
  placeMenu($("moreBtn"), false);
  const r = $("moreBtn").getBoundingClientRect();
  menuEl.style.left = Math.max(12, r.right - menuEl.offsetWidth) + "px";
  $("moreBtn").setAttribute("aria-expanded", "true");
  menuEl.querySelector("button").focus();
  menuEl.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-m]"); if (!b) return;
    closeMenu();
    if (b.dataset.m === "new") newChat();
    else if (b.dataset.m === "copy") copyText(conversationResultText(chat));
    else if (confirm(`Delete "${chat.title}"?`)) deleteChat(chat.id);
  });
});
document.addEventListener("click", (e) => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });

// ------------------------------------------------------------------ views
// The composer moves between Home and the bottom dock; park it before #view is replaced, or it is destroyed.
const parkComposer = () => $("composerDock").appendChild($("composerBox"));
function show(view) {
  parkComposer();
  if (view === "home") { state.currentId = null; view = "chat"; }
  state.view = view;
  const home = view === "chat" && !(currentChat()?.items.length);
  document.querySelectorAll(".rail-btn").forEach((b) => b.classList.toggle("active", b.dataset.view === (home ? "home" : view)));
  $("composerDock").hidden = view !== "chat" || home;
  $("convoHead").hidden = true;
  $("moreBtn").hidden = true;
  applyModeUi();
  renderChatList();
  ({ chat: renderChat, history: renderHistory, memory: renderMemory, models: renderModels, settings: renderSettings, usage: renderUsage, keys: renderKeys })[view]();
  $("scroll").scrollTop = view === "chat" && state.tab === "overview" ? $("scroll").scrollHeight : 0;
}
document.querySelectorAll(".rail-btn").forEach((b) => b.addEventListener("click", () => { show(b.dataset.view); closeNarrowDrawer(); }));
$("logoBtn").addEventListener("click", () => show("home"));

function renderChat() {
  const chat = currentChat();
  if (activeMode() === "agent") loadAgentConfig();
  if (!chat || !chat.items.length) return renderHome();
  renderConversation(chat);
}

// Home: welcome, the composer, recent conversations and a few totals.
function renderHome() {
  const agentOn = activeMode() === "agent";
  const suggestions = agentOn ? AGENT_SUGGESTIONS : SUGGESTIONS;
  const totals = usageTotals();
  parkComposer();
  $("view").innerHTML = `<div class="home">
    <section class="hero">
      <h1>Welcome to Galliani</h1>

// ------------------------------------------------------------------ conversation view: header, tabs, panels
const AGENT_TABS = [["overview", "Overview"], ["plan", "Plan"], ["activity", "Activity"], ["files", "Files"], ["settings", "Settings"]];
const CHAT_TABS = [["overview", "Overview"], ["routing", "Routing"], ["settings", "Settings"]];
const tabsFor = (chat) => chatKind(chat) === "agent" ? AGENT_TABS : CHAT_TABS;

function renderConversation(chat) {
  if (!tabsFor(chat).some(([t]) => t === state.tab)) state.tab = "overview";
  $("composerDock").appendChild($("composerBox"));
  $("composerDock").hidden = false;
  $("moreBtn").hidden = false;
  renderHead(chat);
  renderTab(chat);
  pollLive(chat);
}
function pollLive(chat) { for (const item of chat.items) if (item.kind === "task" && item.view && !item.view.terminal) pollTask(item); }

function taskTimes(item) {
  const evs = item.events || [];
  const start = item.started || (evs[0] && Date.parse(evs[0].timestamp));
  const end = item.finished || (item.view?.terminal && evs.length ? Date.parse(evs[evs.length - 1].timestamp) : null);
  return { start, end };
}
function taskCost(v) { const u = v?.usage || {}; return u.calls ? (u.cost_micro_usd || 0) / 1e6 : null; }

function renderHead(chat) {
  const st = convState(chat), isAgent = chatKind(chat) === "agent";
  const task = lastTask(chat), v = task?.view;
  const live = !!(v && !task.lost && !v.terminal);
  let meta = "", action = "";
  if (isAgent && v) {
    const { start, end } = taskTimes(task), cost = taskCost(v);
    if (live) { const a = start ? ago(start) : ""; meta = a ? `Started ${a === "now" ? "just now" : a}` : ""; }
    else meta = [end && start ? duration(end - start) : "", cost != null ? money(cost) : ""].filter(Boolean).join(" · ");
    if (live) action = `<button class="btn stop" data-head="stop">${icon("i-stop")}<span class="btn-text">Stop</span></button>`;
    else if (v.result) action = `<button class="btn" data-head="copy" title="Copy the result to share it" aria-label="Copy result"><span class="btn-text">Copy result</span>${icon("i-share")}</button>`;
  } else if (!isAgent) {
    const answers = chat.items.filter((i) => i.kind === "answer");
    const spent = answers.reduce((s, a) => s + a.res.total_cost, 0);
    const lastModel = answers.length ? modelName(answers[answers.length - 1].res.model_id) : "";
    meta = [lastModel, answers.length ? money(spent) : ""].filter(Boolean).join(" · ");
  }
  const counts = isAgent ? { files: chat.items.reduce((n, i) => n + (i.view?.files_changed?.length || 0), 0) } : {};
  $("convoHead").innerHTML = `<div class="inner">
    <div class="task-head">
      <span class="th-ic">${icon(isAgent ? "i-file" : "i-chat")}</span>
      <div class="th-main"><div class="th-title" title="${esc(chat.title)}">${esc(chat.title)}</div>
        <div class="th-sub"><span class="tone-${st.tone}">${esc(st.label)}</span>${meta ? `<span>·</span><span>${esc(meta)}</span>` : ""}</div></div>
      ${action}
    </div>
    <div class="tabs" role="tablist" aria-label="Conversation sections">${tabsFor(chat).map(([id, label]) =>
      `<button role="tab" id="tab-${id}" aria-selected="${state.tab === id}" data-tab="${id}" tabindex="${state.tab === id ? 0 : -1}">${label}${counts[id] ? `<span class="count">${counts[id]}</span>` : ""}</button>`).join("")}</div>
  </div>`;
  $("convoHead").hidden = false;
}
$("convoHead").addEventListener("click", (e) => {
  const chat = currentChat(); if (!chat) return;
  const t = e.target.closest("[data-tab]");
  if (t) return switchTab(t.dataset.tab);
  const h = e.target.closest("[data-head]"); if (!h) return;
  const task = lastTask(chat);
  if (h.dataset.head === "stop" && task) agentAct(task, "cancel", $("convoHead"));
  if (h.dataset.head === "copy") copyText(conversationResultText(chat), h);
});
$("convoHead").addEventListener("keydown", (e) => {  // arrow keys move between tabs
  if (!e.target.matches('[role="tab"]') || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const tabs = [...$("convoHead").querySelectorAll('[role="tab"]')], i = tabs.indexOf(e.target);
  const next = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
  switchTab(next.dataset.tab); $(`tab-${next.dataset.tab}`)?.focus();
});
function switchTab(tab) {
  const chat = currentChat(); if (!chat) return;
  state.tab = tab;
  renderHead(chat); renderTab(chat);
  $("scroll").scrollTop = tab === "overview" ? $("scroll").scrollHeight : 0;
}

function renderTab(chat) {
  const tab = state.tab;
  if (tab === "overview") {
    $("view").innerHTML = `<div class="thread" id="thread" role="tabpanel" aria-labelledby="tab-overview"></div>`;
    for (const item of chat.items) appendItem(item, false);
    fitClamps($("thread"));
    return;
  }
  const body = { plan: planTab, activity: activityTab, files: filesTab, routing: routingTab, settings: settingsTab }[tab](chat);
  $("view").innerHTML = `<div class="page tabpage" id="tabpanel" role="tabpanel" aria-labelledby="tab-${tab}">${body}</div>`;
  if (tab === "settings") wireSettingsTab(chat);
}

function appendItem(item, scroll = true) {
  const thread = $("thread"); if (!thread) return;
  const el = document.createElement("div");
  el.className = "msg" + (item.kind === "user" ? " user" : "");
  if (item.kind === "user") el.innerHTML = `<div class="bubble">${esc(item.text)}</div>`;
  else if (item.kind === "answer") el.innerHTML = answerHtml(item);
  else if (item.kind === "preview") el.innerHTML = previewHtml(item);
  else if (item.kind === "task") { el.dataset.task = item.task_id; el.innerHTML = taskHtml(item); }
  else el.innerHTML = `<div class="error" role="alert"><strong>${esc(item.text)}</strong>${item.extra ? `<pre class="mono">${esc(item.extra)}</pre>` : ""}</div>`;
  thread.appendChild(el);
  wire(el, item);
  if (scroll) { fitClamps(el); scrollDown(); }
  return el;
}
function scrollDown() { requestAnimationFrame(() => $("scroll").scrollTo({ top: $("scroll").scrollHeight, behavior: "smooth" })); }

function answerHtml(item) {
  const r = item.res;
  const pct = r.frontier_cost > 0 ? Math.round((1 - r.total_cost / r.frontier_cost) * 100) : 0;
  const via = r.provider && r.provider !== "openrouter" ? `<span>via ${esc(PROVIDER_LABEL[r.provider] || r.provider)}</span>` : "";
  const fell = r.attempts.length > 1 ? `<span class="badge" title="${esc(r.errors.join("\n"))}">fallback</span>` : "";
  const saved = r.model_id !== r.frontier_model && pct > 0 ? `<span class="saved">${pct}% less than ${esc(modelName(r.frontier_model))}</span>` : "";
  return `<div class="answer"><div class="body">${markdown(r.answer || "_(empty answer)_")}</div>
    <div class="meta">
      <button class="chip" data-act="route" aria-expanded="false" title="Why this model">${vendorIcon(r.model_id)}${esc(modelName(r.model_id))}</button>
      ${via}${fell}<span>${money(r.total_cost)}</span>${saved}<span>${(r.latency_ms / 1000).toFixed(1)} s</span>
      <button class="copy-btn" data-act="copy" title="Copy" aria-label="Copy answer">${icon("i-copy")}</button>
    </div>
    <div class="route-inline card" hidden></div></div>`;
}
function previewHtml(item) {
  const r = item.route;
  return `<div class="preview card">
    <div class="row">${vendorIcon(r.model_id)}<strong>${esc(modelName(r.model_id))}</strong>
      <span class="${confClass(r.confidence)}">${Math.round(r.confidence * 100)}%</span>
      ${r.escalated ? '<span class="badge">switched</span>' : ""}</div>
    ${detailsHtml(r)}
    ${item.done ? "" : `<div class="actions"><button class="btn primary" data-act="run">Run with ${esc(modelName(r.model_id))}</button></div>`}
  </div>`;
}
function wire(el, item) {
  el.querySelector('[data-act="route"]')?.addEventListener("click", (e) => {
    const box = el.querySelector(".route-inline"); if (!box || !item.route) return;
    if (box.hidden) box.innerHTML = detailsHtml(item.route);
    box.hidden = !box.hidden; e.currentTarget.setAttribute("aria-expanded", String(!box.hidden));
  });
  el.querySelector('[data-act="copy"]')?.addEventListener("click", (e) => copyText(item.res.answer, e.currentTarget));
  el.querySelector('[data-act="run"]')?.addEventListener("click", () => {
    item.done = true; saveChats();
    el.querySelector(".actions")?.remove();
    send(item.prompt, item.route);
  });
}
function copyText(text, btn) {
  navigator.clipboard?.writeText(text);
  if (!btn) return;
  const before = btn.innerHTML;
  btn.innerHTML = btn.classList.contains("copy-btn") ? icon("i-check") : `${icon("i-check")}Copied`;
  setTimeout(() => (btn.innerHTML = before), 1200);
}

// ------------------------------------------------------------------ sending
function busy(on, label) {
  state.busy = on;
  $("sendBtn").disabled = on; $("previewBtn").disabled = on;
  document.getElementById("thinking")?.remove();
  if (on && $("thread")) {
    const el = document.createElement("div"); el.className = "msg"; el.id = "thinking";
    el.innerHTML = `<div class="thinking"><span class="spin"></span>${esc(label)}</div>`;
    $("thread").appendChild(el); scrollDown();
  }
}
// Show the conversation's Overview (the thread) before adding to it.
function openThread(chat) {
  if ($("thread") && state.view === "chat") return;
  state.view = "chat"; state.tab = "overview";
  document.querySelectorAll(".rail-btn").forEach((b) => b.classList.remove("active"));
  renderConversation(chat);
  renderChatList();
}
function addUser(chat, prompt) {
  const item = { kind: "user", text: prompt };
  chat.items.push(item); appendItem(item); touch(chat); applyModeUi();
}
function pushError(chat, e) {
  const d = e.detail;
  let msg = typeof d === "string" ? d : d?.message || e.message || "Something went wrong.";
  const extra = Array.isArray(d?.errors) ? d.errors.join("\n") : "";
  if (/credits|402/i.test(msg + extra)) msg += " Your OpenRouter account may be out of credits.";
  const item = { kind: "error", text: msg, extra };
  chat.items.push(item); appendItem(item); touch(chat);
  if (state.view === "chat" && currentChat() === chat) renderHead(chat);
}
async function preview() {
  const prompt = $("prompt").value.trim();
  if (!prompt || state.busy) return;
  if (!hasRouterKey()) return show("keys");
  const chat = ensureChat(prompt); openThread(chat);
  $("prompt").value = ""; grow();
  addUser(chat, prompt);
  busy(true, "Jev is choosing a model…");
  try {
    const route = await api("/api/route", { messages: [...chat.messages, { role: "user", content: prompt }], mode: state.mode });
    busy(false);
    const item = { kind: "preview", prompt, route };
    chat.items.push(item); appendItem(item); touch(chat);
  } catch (e) { busy(false); pushError(chat, e); }
}
async function send(text, planned) {
  if (!planned && activeMode() === "agent") return sendTask(text);
  const prompt = (text ?? $("prompt").value).trim();
  if (!prompt || state.busy) return;
  if (!hasRouterKey()) return show("keys");
  const chat = ensureChat(prompt); openThread(chat);
  if (!planned) { $("prompt").value = ""; grow(); addUser(chat, prompt); }  // a preview already showed it
  const messages = [...chat.messages, { role: "user", content: prompt }];
  busy(true, planned ? `${modelName(planned.model_id)} is writing…` : "Choosing a model…");
  try {
    const body = { messages, mode: state.mode };
    if (planned) body.route = { model_id: planned.model_id, fallbacks: planned.fallbacks, confidence: planned.confidence, reason: planned.reason };
    const res = await api("/api/chat", body);
    busy(false);
    chat.messages = [...messages, { role: "assistant", content: res.answer }];
    const route = res.route || planned;
    const { route: _drop, ...rest } = res;
    const item = { kind: "answer", res: rest, route };
    chat.items.push(item); appendItem(item); touch(chat);
    if (currentChat() === chat) renderHead(chat);
    refreshCredit();
  } catch (e) { busy(false); pushError(chat, e); }
}

function usageTotals() {
  const answers = state.chats.flatMap((c) => c.items.filter((i) => i.kind === "answer"));
  const tasks = state.chats.flatMap((c) => c.items.filter((i) => i.kind === "task" && i.view));
  const chatSpent = answers.reduce((s, a) => s + a.res.total_cost, 0);
  const taskSpent = tasks.reduce((s, t) => s + (taskCost(t.view) || 0), 0);
  const frontier = answers.reduce((s, a) => s + a.res.frontier_cost, 0);
  return { answers, tasks, chatSpent, taskSpent, spent: chatSpent + taskSpent, saved: Math.max(0, frontier - chatSpent),
           completed: tasks.filter((t) => t.view.status === "done").length };
}
