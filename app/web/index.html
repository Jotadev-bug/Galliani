// A conversation is either a normal chat or an agent chat. In an agent chat each message starts a supervised
// task. Everything shown comes from the server's view models: public summaries only. A finished task shows a
// short final response (summary, verification, files); long output is clamped and code blocks are folded.
const AGENT_SUGGESTIONS = [
  ["i-file", "", "Summarize notes into summary.md", "Summarize the notes in this folder into summary.md"],
  ["i-code", "", "List TODO comments in todo.md", "Find the TODO comments in this project and list them, with file names, in todo.md"],
  ["i-lang", "", "Compare two documents", "Compare "],
  ["i-brain", "", "Remember a preference", "Remember that I prefer short bullet points in summaries"],
];
const agent = { config: null, polls: {}, editModes: new Map() };  // edit mode per conversation, never saved (014 R9)
const STEP_LABEL = { pending: "Pending", running: "Running", waiting: "Waiting for you", verified: "Verified", failed: "Failed", canceled: "Canceled" };
const EVENT_LABEL = {
  status_changed: "Status", plan_created: "Plan ready", plan_revised: "Plan revised", plan_rejected: "Plan rejected",
  route_selected: "Model chosen", route_fallback: "Fallback", route_failed: "No model", permission_decided: "Permission",
  tool_called: "Tool", verification_completed: "Checked", retry_scheduled: "Retry", replan_started: "Replanning",
  approval_recorded: "Approved", task_finished: "Finished", memory_retrieved: "Memory", diagnostic: "Note",
  edit_mode_changed: "Edit mode",
};
const QUIET_EVENTS = new Set(["task_created", "step_executed", "worker_completed"]);
const clock = (ts) => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const errText = (e, fallback) => typeof e.detail === "string" ? e.detail : fallback;
const chatKind = (chat) => chat?.kind || "chat";
const folderName = (p) => (p || "").replace(/[\\/]+$/, "").split(/[\\/]/).pop() || p || "";
const toolLabel = (cap) => { const s = String(cap).replace(/[_-]+/g, " "); return s[0].toUpperCase() + s.slice(1); };

function activeMode() { const c = currentChat(); return c && c.items.length ? chatKind(c) : state.composeMode; }
function agentWorkspace() { return currentChat()?.workspace || store.get("galliani.agent.workspace", "") || agent.config?.workspace_root || ""; }
function heroAgentText() {
  return editMode() === "accept_edits"
    ? "Galliani plans the work, uses tools in your folder, and checks the result. It creates and changes files in the folder without asking; anything else still asks."
    : "Galliani plans the work, uses tools in your folder, checks the result, and asks before changing anything.";
}
function editMode() { return agent.editModes.get(state.currentId || "") || "ask"; }
function liveTask(chat) { return chat?.items.find((i) => i.kind === "task" && i.view && !i.view.terminal && !i.lost); }
async function setEditMode(mode, { syncTask = true } = {}) {
  agent.editModes.set(state.currentId || "", mode);
  applyModeUi();
  const item = syncTask && liveTask(currentChat());
  if (!item) return;
  try { item.view = await api(`/api/agent/tasks/${encodeURIComponent(item.task_id)}/edit-mode`, { edit_mode: mode }); refreshTaskCard(item); }
  catch (e) { if (e.status !== 404 && e.status !== 409) alert(errText(e, "Could not change the edit mode of the running task.")); }
}
function agentBudget() { const b = parseFloat(store.get("galliani.agent.budget", "")); return b > 0 ? b : (agent.config?.default_budget_usd ?? 0.5); }

async function loadAgentConfig() {
  if (!agent.config) {
    try { agent.config = await api("/api/agent/config"); }
    catch { agent.config = { enabled: false, reason: "Could not reach the local server." }; }
    applyModeUi();
  }
  return agent.config;
}

function setComposeMode(mode) {
  const c = currentChat();
  if (c && c.items.length && chatKind(c) !== mode) state.currentId = null;  // a conversation keeps its kind
  state.composeMode = mode; store.set("galliani.composeMode", mode);
  show("chat"); $("prompt").focus();
}

function applyModeUi() {
  const mode = state.view === "chat" ? activeMode() : "chat";
  const on = mode === "agent", inConvo = !!currentChat()?.items.length;
  $("app").classList.toggle("agent-mode", on);
  document.querySelectorAll("#modeSeg [data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  const agentBtn = document.querySelector('#modeSeg [data-mode="agent"]');
  const off = agent.config && !agent.config.enabled;
  agentBtn.disabled = !!off;
  agentBtn.title = off ? agent.config.reason : "Agent: plans, uses tools in a folder, checks the result";
  $("prompt").placeholder = on ? (inConvo ? "Message Galliani about this task…" : "What should Galliani do?")
                               : (inConvo ? "Message Galliani…" : "What can Galliani help you with today?");
  $("prompt").setAttribute("aria-label", on ? "Task for the agent" : "Message");
  $("modeTool").hidden = on; $("previewBtn").hidden = on; $("folderChip").hidden = !on; $("editToggle").hidden = !on;
  const accept = editMode() === "accept_edits";
  $("editToggle").setAttribute("aria-pressed", String(accept));
  $("editLabel").textContent = accept ? "Accept edits" : "Ask before edits";
  if ($("heroLead") && on) $("heroLead").textContent = heroAgentText();
  $("editToggle").title = accept
    ? "The agent creates and changes files in this folder without asking. Other actions still ask. Click to ask before each write."
    : "The agent asks before writing each file. Click to let it create and change files in this folder without asking.";
  const ws = agentWorkspace();
  $("folderLabel").textContent = ws ? folderName(ws) : "Choose folder";
  $("folderChip").title = ws ? `Agent folder: ${ws}` : "Choose the folder the agent works in";
}
$("editToggle").addEventListener("click", () => setEditMode(editMode() === "accept_edits" ? "ask" : "accept_edits"));
$("modeSeg").addEventListener("click", (e) => { const b = e.target.closest("[data-mode]"); if (b && !b.disabled) setComposeMode(b.dataset.mode); });

function openFolderPicker(anchor = $("folderChip")) {
  closeMenu();
  const root = agent.config?.workspace_root;
  menuEl = document.createElement("div");
  menuEl.className = "menu folder-menu"; menuEl.setAttribute("role", "dialog"); menuEl.setAttribute("aria-label", "Agent folder");
  menuEl.style.width = "380px";
  menuEl.innerHTML = `<label class="field"><span>Folder the agent works in</span>
      <input id="fpInput" value="${esc(agentWorkspace())}" spellcheck="false" autocomplete="off" placeholder="${esc(root || "C:\\Users\\you\\Documents\\project")}"></label>
    <small class="sub">It can only read and write inside this folder${root ? ` (must be inside ${esc(root)})` : ""}. Writing always asks you first.</small>
    <div class="fp-actions"><button class="btn" id="fpBrowse" hidden>Browse…</button><span style="flex:1"></span><button class="btn primary" id="fpSave">Use folder</button></div>`;
  const r = anchor.getBoundingClientRect();
  placeMenu(anchor, r.top > innerHeight / 2);
  const input = $("fpInput"); input.focus(); input.select();
  if (window.pywebview?.api?.pick_folder) $("fpBrowse").hidden = false;
  $("fpBrowse").addEventListener("click", async () => { try { const p = await window.pywebview.api.pick_folder(); if (p) input.value = p; } catch {} });
  const save = () => {
    const v = input.value.trim(); if (!v) return input.focus();
    store.set("galliani.agent.workspace", v);
    const c = currentChat(); if (c && chatKind(c) === "agent") { c.workspace = v; saveChats(); }
    closeMenu(); applyModeUi();
    if (state.view === "chat" && state.tab === "settings" && c) renderTab(c); else $("prompt").focus();
  };
  $("fpSave").addEventListener("click", save);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); save(); } });
}
$("folderChip").addEventListener("click", (e) => { e.stopPropagation(); menuEl ? closeMenu() : openFolderPicker(); });

async function sendTask(text) {
  const prompt = (text ?? $("prompt").value).trim();
  if (!prompt || state.busy) return;
  const cfg = await loadAgentConfig();
  if (!cfg.enabled) return alert(cfg.reason);
  if (!agentWorkspace()) return openFolderPicker();
  let chat = currentChat();
  if (chat?.items.some((i) => i.kind === "task" && i.view && !i.view.terminal && !i.lost)) {
    return alert("The agent is still on the previous task. Answer it, wait for it, or stop it first.");
  }
  const mode = editMode();
  chat = ensureChat(prompt);
  chat.kind = "agent"; chat.workspace ||= agentWorkspace();
  agent.editModes.set(chat.id, mode);
  agent.editModes.delete("");
  openThread(chat);
  if (text === undefined) { $("prompt").value = ""; grow(); }
  addUser(chat, prompt);
  const earlier = chat.items.filter((i) => i.kind === "task" && i.view?.result).slice(-3)
    .map((i) => `- ${i.objective} -> ${i.view.result.status}: ${i.view.result.summary}`).join("\n");
  state.busy = true; $("sendBtn").disabled = true;
  try {
    const view = await api("/api/agent/tasks", { objective: prompt, workspace: chat.workspace, budget_usd: agentBudget(), edit_mode: mode,
      context: earlier ? `Earlier tasks in this conversation:\n${earlier}` : "" });
    const item = { kind: "task", task_id: view.task_id, objective: prompt, view, events: [], seq: 0, started: Date.now() };
    chat.items.push(item); appendItem(item); touch(chat);
    if (currentChat() === chat) renderHead(chat);
    pollTask(item);
  } catch (e) { pushError(chat, e); }
  finally { state.busy = false; $("sendBtn").disabled = false; }
}

async function pollTask(item) {
  if (agent.polls[item.task_id] || item.lost) return;
  agent.polls[item.task_id] = true;
  try {
    for (;;) {
      const page = await api(`/api/agent/tasks/${encodeURIComponent(item.task_id)}/events?after=${item.seq || 0}&wait=20`);
      const before = item.view;
      item.events = [...(item.events || []), ...page.events].slice(-150);
      item.seq = page.seq; item.view = page.view; item.stale = false;
      if (page.view.terminal && !item.finished) item.finished = Date.now();
      if (page.events.length || !before || before.status !== page.view.status || before.updated_at !== page.view.updated_at) {
        saveChats(); refreshTaskCard(item);
      }
      if (page.view.terminal) break;
    }
  } catch (e) {
    if (e.status === 404) item.lost = true; else item.stale = true;  // 012: keep the last known state, offer retry
    saveChats(); refreshTaskCard(item);
  } finally { delete agent.polls[item.task_id]; }
}

function findTaskItem(id) {
  for (const c of state.chats) for (const i of c.items) if (i.kind === "task" && i.task_id === id) return i;
  return null;
}
const chatOf = (item) => state.chats.find((c) => c.items.includes(item)) || null;

// Called whenever a task's view changes: updates whatever part of the screen shows it.
function refreshTaskCard(item) {
  renderChatList();
  if (state.view !== "chat") return;
  const chat = currentChat();
  if (!chat || !chat.items.length) return refreshRecent();
  if (!chat.items.includes(item)) return;
  renderHead(chat);
  if (state.tab === "plan" || state.tab === "activity" || state.tab === "files") return renderTab(chat);
  if (state.tab !== "overview") return;
  const el = document.querySelector(`[data-task="${CSS.escape(item.task_id)}"]`); if (!el) return;
  const answer = el.querySelector("textarea"), draft = answer?.value, typing = !!answer && document.activeElement === answer;
  const prevPrompt = el.querySelector("[data-prompt]")?.dataset.prompt, prevQ = el.querySelector("[data-q]")?.dataset.q;
  const sc = $("scroll"), nearBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160;
  el.innerHTML = taskHtml(item);
  fitClamps(el);
  const ta = el.querySelector("textarea");
  if (ta && draft) ta.value = draft;
  if (typing) ta?.focus();
  const v = item.view;
  if (!typing && v?.approval_prompt && prevPrompt !== v.approval_prompt.prompt_id) el.querySelector(".callout h3")?.focus();
  else if (!typing && v?.clarification && prevQ !== v.clarification) ta?.focus();
  if (nearBottom) scrollDown();
}

// The task as shown in Overview: live progress with any pause right under it (next to the composer), or the
// final response once it ends.
function taskHtml(item) {
  const v = item.view;
  if (!v) return `<div class="card"><div class="thinking"><span class="spin"></span>Starting…</div></div>`;
  const id = item.task_id;
  const visible = (item.events || []).filter((e) => !QUIET_EVENTS.has(e.type));
  const latest = visible[visible.length - 1];
  const live = !item.lost && !v.terminal;
  const notice = item.lost && !v.terminal
    ? `<div class="stale">${icon("i-shield")}<span>This task stopped when the app closed. Showing its last known state.</span></div>`
    : item.stale ? `<div class="stale" role="status">${icon("i-shield")}<span>Lost the connection to this task. Showing the last known state.</span><button class="btn" data-ag="reconnect">Retry</button></div>` : "";
  const editBadge = v.edit_mode === "accept_edits" && live ? `<span class="edit-badge" title="File writes in this folder run without asking">Accepting edits</span>` : "";
  const progress = v.terminal ? "" : `<section class="card" aria-label="Agent progress">
      <h3>Agent progress<span class="card-h-right">${editBadge}</span></h3>${progressHtml(v, item)}${memoryHtml(v)}</section>${modelToolsHtml(v, item)}`;
  return `<article class="task" aria-label="Agent task">
    ${notice}${progress}${live ? approvalHtml(v, id) + questionHtml(v, id) : ""}${v.terminal ? finalHtml(v, item) : ""}
    <div class="sr-only" aria-live="polite">${latest && live ? esc(`${EVENT_LABEL[latest.type] || latest.type}: ${latest.public_summary}`) : ""}</div>
  </article>`;
}

function approvalHtml(v, id) {
  const p = v.approval_prompt; if (!p) return "";
  const action = (p.action_summary.match(/'([^']+)'/) || [])[1] || "this action";
  return `<section class="callout" data-prompt="${esc(p.prompt_id)}" role="alertdialog" aria-labelledby="ap-${esc(id)}" aria-describedby="apd-${esc(id)}">
    <h3 id="ap-${esc(id)}" tabindex="-1">${icon("i-shield")}Approval needed</h3>
    <p id="apd-${esc(id)}" style="margin:0">${esc(p.action_summary)}</p>
    <dl class="kv"><dt>Risk</dt><dd>${esc(p.risk_summary)}</dd><dt>Scope</dt><dd class="mono">${esc(p.scope)}</dd></dl>
    <div class="sub">The task is paused. Nothing happens until you choose.</div>
    <div class="actions">
      <button class="btn primary" data-ag="approve" aria-label="Approve ${esc(action)} for ${esc(p.scope)}">Approve</button>
      ${(p.allowed_choices || []).includes("approve_and_accept_edits") ? `<button class="btn" data-ag="approve-accept"
        title="Approve this write, and let the agent create and change files in this folder without asking for the rest of this task"
        aria-label="Approve ${esc(action)} and accept edits for this task">${icon("i-edits")}Yes, and accept edits</button>` : ""}
      <button class="btn" data-ag="deny" aria-label="Deny ${esc(action)}">Deny</button>
      <button class="btn danger" data-ag="cancel">Cancel task</button>
    </div></section>`;
}

function questionHtml(v, id) {
  if (!v.clarification) return "";
  return `<section class="callout question" data-q="${esc(v.clarification)}" role="group" aria-labelledby="q-${esc(id)}">
    <h3 id="q-${esc(id)}">${icon("i-help")}Galliani needs an answer</h3>
    <label for="ans-${esc(id)}" class="q">${esc(v.clarification)}</label>
    <textarea id="ans-${esc(id)}" rows="2" placeholder="Your answer"></textarea>
    <div class="actions"><button class="btn primary" data-ag="clarify">Send answer</button>
      <button class="btn danger" data-ag="cancel">Cancel task</button></div></section>`;
}

// Progress: understanding and planning, then the plan's own steps, then the final check.
function stepIcon(s) {
  if (s.kind !== "tool") return "i-spark";
  const c = s.capability;
  return /remember|memory/.test(c) ? "i-brain" : /write|edit|create/.test(c) ? "i-edits" : /web|search|fetch|http/.test(c) ? "i-globe"
       : /read|list|file/.test(c) ? "i-file" : "i-tool";
}
function progressSteps(v, item) {
  const p = v.plan, st = v.status, live = !item.lost && !v.terminal;
  const steps = [{
    title: "Understanding the objective", ic: "i-target",
    sub: v.memory?.used?.length ? "Reading your request and the notes that apply from memory." : "Reading your request and defining the scope.",
    state: st === "created" && !p && live ? "running" : "verified",
  }, {
    title: "Planning", ic: "i-list",
    sub: p ? `${plural(p.steps.length, "step")}${p.version > 1 ? " · revised" : ""}` : "Breaking the task into steps.",
    state: p ? "verified" : v.clarification ? "waiting" : v.terminal ? (st === "done" ? "verified" : st === "canceled" ? "canceled" : "failed")
         : item.lost ? "canceled" : st === "created" ? "pending" : "running",
  }];
  if (!p) return steps;
  for (const s of p.steps) {
    steps.push({ title: s.purpose, ic: stepIcon(s), state: s.state, current: s.step_id === v.current_step,
                 sub: `${s.kind === "tool" ? toolLabel(s.capability) : "Model · " + s.capability}${s.state === "running" ? " · working…" : ""}${s.attempts > 1 ? ` · ${s.attempts} attempts` : ""}` });
  }
  steps.push({ title: "Reviewing and finishing", ic: "i-flag", sub: "Checking the result before marking it done.",
               state: st === "done" ? "verified" : st === "failed" || st === "blocked" ? "failed" : st === "canceled" ? "canceled" : "pending" });
  return steps;
}
function stateGlyph(s) {
  if (s === "running") return `<span class="ring"></span>`;
  return icon({ verified: "i-check-c", failed: "i-x-c", waiting: "i-pause-c", pending: "i-dash-c", canceled: "i-dash-c" }[s] || "i-dash-c");
}
function progressHtml(v, item) {
  const steps = progressSteps(v, item);
  return `<ol class="progress">${steps.map((s) => `
    <li class="pstep ${s.state}"${s.current ? ' aria-current="step"' : ""}>
      <span class="pnode">${icon(s.ic)}</span>
      <div class="pbody"><div class="ptitle">${esc(s.title)}</div><div class="psub">${esc(s.sub)}</div></div>
      <span class="pstate" role="img" aria-label="${STEP_LABEL[s.state]}">${stateGlyph(s.state)}</span>
    </li>`).join("")}</ol>
    ${v.plan?.revision_reason ? `<p class="revision">Revised: ${esc(v.plan.revision_reason)}</p>` : ""}`;
}

// The model doing the current step (from the router's public rationale) and the tools the plan uses.
function currentWorker(item) {
  const evs = item.events || [];
  for (let i = evs.length - 1; i >= 0; i--) {
    const e = evs[i];
    const m = e.type === "route_selected" ? e.public_summary.match(/^Selected (\S+): /)
            : e.type === "route_fallback" ? e.public_summary.match(/^falling back to (\S+)/) : null;
    if (m) return m[1];
  }
  return null;
}
function workerHtml(id) {
  const bare = id.replace(/^[\w.-]+:/, "");
  return bare.includes("/") ? `${vendorIcon(bare)}<span>${esc(modelName(bare))}</span>` : `${icon("i-spark")}<span class="mono">${esc(id)}</span>`;
}
function modelToolsHtml(v, item) {
  const worker = currentWorker(item);
  const steps = v.plan?.steps || [];
  const tools = [...new Set(steps.filter((s) => s.kind === "tool").map((s) => s.capability))];
  const running = steps.find((s) => s.step_id === v.current_step);
  if (!worker && !tools.length) return "";
  return `<section class="card" aria-label="Model and tools"><h3>Model &amp; tools</h3><div class="mt-grid">
    <div><div class="mt-k">Current model</div><div class="mt-model">${worker ? workerHtml(worker) : `<span class="sub">Not chosen yet</span>`}</div></div>
    <div><div class="mt-k">Tools in plan</div><div class="tool-chips">${tools.length ? tools.map((t) => `<span class="tool-chip${running?.capability === t ? " on" : ""}">${icon(stepIcon({ kind: "tool", capability: t }))}${esc(toolLabel(t))}</span>`).join("")
      : `<span class="sub">Model steps only</span>`}</div></div>
  </div></section>`;
}

// Final response: a short outcome, verification, the files, and the output kept compact.
function finalHtml(v, item) {
  const r = v.result, ok = v.status === "done";
  const chat = chatOf(item), latest = chat && lastTask(chat) === item;
  const changed = v.files_changed || [];
  const files = changed.length ? changed.map((f) => ({ path: f.path, note: f.change === "overwritten" ? "Overwritten" : "New file", over: f.change === "overwritten" }))
    : (r?.artifacts || []).map((a) => ({ path: a.uri, note: "Saved" }));
  const heading = ok ? "Final response" : { failed: "Task failed", blocked: "Task blocked", canceled: "Task canceled" }[v.status] || v.status_label;
  const auto = v.edits_auto_approved ? ` ${plural(v.edits_auto_approved, "write")} accepted without asking.` : "";
  const lead = !r ? `<p class="lead-line fail">${esc(v.status_label)}.</p>`
    : ok ? (files.length ? `<p class="lead-line">Finished. Saved ${plural(files.length, "file")} in <span class="mono">${esc(folderName(chatOf(item)?.workspace) || "your folder")}</span>.${esc(auto)}</p>` : "")
    : `<p class="lead-line fail">${esc(r.summary)}</p>`;
  const ver = r?.verification;
  const verif = !r ? "" : ver ? `<div class="verif ${ver.status === "pass" ? "pass" : "fail"}">${icon(ver.status === "pass" ? "i-check-c" : "i-x-c")}
      <span>${ver.status === "pass" ? "Verified" : "Not verified"}: ${esc(ver.reason_summary)}</span></div>`
    : `<div class="verif none">${icon("i-x-c")}<span>Not verified, so the task was not marked done.</span></div>`;
  const fileCards = files.length ? `<div class="file-cards">${files.map((f) => `
    <div class="file-card"><span class="fc-ic">${icon("i-file")}</span>
      <div class="fc-main"><div class="fc-name mono" title="${esc(f.path)}">${esc(folderName(f.path))}</div>
        <div class="fc-sub"><span class="${f.over ? "over" : ""}">${f.note}</span>${f.path.includes("/") || f.path.includes("\\") ? ` · ${esc(f.path)}` : ""}</div></div>
      <button class="copy-btn" data-copy="${esc(f.path)}" title="Copy path" aria-label="Copy path of ${esc(f.path)}">${icon("i-copy")}</button>
    </div>`).join("")}</div>` : "";
  const next = !ok ? `<div class="next"><button class="btn primary" data-ag="retry">Try again</button><button class="btn" data-ag="edit">Edit task</button></div>`
    : latest ? `<div class="next-wrap"><div class="k">What would you like to do next?</div><div class="next">${nextSteps(item, files).map((s) =>
        `<button data-fill="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>` : "";
  return `<section class="card final" aria-label="Result">
    <h3>${heading}</h3>
    ${lead}${fileCards}${r ? outputHtml(r, files.length > 0) : ""}${verif}${memoryHtml(v)}
    <div class="final-foot">
      ${r ? `<button class="copy-btn" data-ag="copy" title="Copy result" aria-label="Copy result">${icon("i-copy")}</button>` : ""}
      <button class="link-btn" data-goto="plan">Plan</button><button class="link-btn" data-goto="activity">Activity</button>
      <span class="grow"></span>${usageLine(v)}
    </div>
    ${next}
  </section>`;
}
// The output, kept compact: text is clamped with "Show more" and code blocks are folded. When the task saved
// files, the model text that went into them is not repeated here (it is in the files).
function outputHtml(r, hasFiles) {
  let text = null;
  if (r.output_kind === "text" && r.output) text = r.output;
  else if (!hasFiles && r.preview) text = r.preview;
  if (!text) return "";
  return `<div class="result-body"><div class="clamp body" data-clamp>${markdown(text, { foldCode: true })}</div>
    <button class="link-btn more-btn" data-more hidden>Show more</button></div>`;
}
function fitClamps(root) {
  root?.querySelectorAll("[data-clamp]").forEach((c) => {
    const fits = c.scrollHeight <= c.clientHeight + 4;
    c.classList.toggle("fits", fits);
    const more = c.parentElement.querySelector("[data-more]"); if (more) more.hidden = fits && !c.classList.contains("open");
  });
}
function nextSteps(item, files) {
  if (files.length) {
    const f = folderName(files[0].path);
    return [`Explain what changed in ${f}`, `Review ${f} for mistakes`, "Make further improvements"];
  }
  return ["Make it shorter", "Go into more detail", "Save this to a file"];
}
function resultText(item) {
  const v = item.view, r = v?.result; if (!r) return "";
  const parts = [`${item.objective}`, `${v.status_label}: ${r.summary}`];
  if (r.output_kind === "text" && r.output) parts.push(r.output);
  const files = (v.files_changed || []).map((f) => f.path);
  if (files.length) parts.push(`Files: ${files.join(", ")}`);
  return parts.join("\n\n");
}
function conversationResultText(chat) {
  if (chatKind(chat) === "agent") return resultText(lastTask(chat) || {});
  const a = [...chat.items].reverse().find((i) => i.kind === "answer");
  return a ? a.res.answer : chat.title;
}

function memoryHtml(v) {
  const m = v.memory || { records: [], used: [], note: "" };
  const quote = (xs) => xs.map((x) => `“${esc(x.summary)}”`).join(", ");
  const used = m.used?.length ? `<div>${icon("i-brain")}<span>Used from memory: ${quote(m.used)}</span></div>` : "";
  const saved = m.records?.length ? `<div>${icon("i-brain")}<span>Saved to memory: ${quote(m.records)}</span></div>` : "";
  const note = v.terminal ? `<div class="note">${icon("i-brain")}<span>${esc(m.note)}</span></div>` : "";
  return used || saved || note ? `<div class="tc-memory">${used}${saved}${note}</div>` : "";
}

function usageLine(v) {
  const u = v.usage || {}; if (!u.calls) return "";
  const tokens = (u.input_tokens || 0) + (u.output_tokens || 0);
  return `<span class="usage-line">${plural(u.calls, "model call")} · ${tokens.toLocaleString()} tokens · est. ${money((u.cost_micro_usd || 0) / 1e6)}</span>`;
}

// ---- the other tabs of an agent conversation
const tasksOf = (chat) => chat.items.filter((i) => i.kind === "task");
function taskLabelHtml(item, i, n) {
  const st = convState({ kind: "agent", items: [item] });
  return `<div class="task-label">${n > 1 ? `<span>Task ${i + 1}</span>` : ""}<span class="obj" title="${esc(item.objective)}">${esc(item.objective)}</span><span class="tone-${st.tone}">${esc(st.label)}</span></div>`;
}
function eachTask(chat, render, empty) {
  const tasks = tasksOf(chat);
  return tasks.length ? tasks.map((t, i) => taskLabelHtml(t, i, tasks.length) + render(t)).join("") : `<div class="empty-rows">${empty}</div>`;
}
function planTab(chat) {
  return eachTask(chat, (t) => t.view ? `<section class="card">${progressHtml(t.view, t)}</section>` : "", "No tasks yet.");
}
function activityTab(chat) {
  return eachTask(chat, (t) => {
    const visible = (t.events || []).filter((e) => !QUIET_EVENTS.has(e.type));
    return `<section class="card">${visible.length ? `<ol class="feed">${visible.map((e) => `<li><time datetime="${esc(e.timestamp)}">${clock(e.timestamp)}</time>
      <span class="ev">${esc(EVENT_LABEL[e.type] || e.type)}</span>
      <span class="sum">${e.refs.step_id ? `<span class="mono">${esc(e.refs.step_id)}</span> · ` : ""}${esc(e.public_summary)}</span></li>`).join("")}</ol>`
      : `<div class="sub">No activity yet.</div>`}${t.view && usageLine(t.view) ? `<div style="margin-top:10px">${usageLine(t.view)}</div>` : ""}</section>`;
  }, "No tasks yet.");
}
function filesTab(chat) {
  const ws = chat.workspace;
  return `<div class="panel"><div class="row">${icon("i-folder", "agent-ic")}<div class="grow"><div class="title">Agent folder</div>
      <div class="sub mono">${esc(ws || "Not chosen")}</div></div></div></div>` + eachTask(chat, (t) => {
    const v = t.view, r = v?.result;
    const changed = v?.files_changed || [];
    const list = changed.length ? `<div class="file-cards">${changed.map((f) => `<div class="file-card"><span class="fc-ic">${icon("i-file")}</span>
        <div class="fc-main"><div class="fc-name mono">${esc(f.path)}</div><div class="fc-sub"><span class="${f.change === "overwritten" ? "over" : ""}">${f.change === "overwritten" ? "Overwritten" : "New file"}</span></div></div>
        <button class="copy-btn" data-copy="${esc(f.path)}" title="Copy path" aria-label="Copy path of ${esc(f.path)}">${icon("i-copy")}</button></div>`).join("")}</div>`
      : r?.artifacts?.length ? `<div class="file-cards">${r.artifacts.map((a) => `<div class="file-card"><span class="fc-ic">${icon("i-file")}</span><div class="fc-main"><div class="fc-name mono">${esc(a.uri)}</div></div></div>`).join("")}</div>`
      : `<div class="sub">No files written.</div>`;
    const raw = r && r.output != null && r.output_kind === "json"
      ? `<details class="raw"><summary>Tool result</summary><pre class="mono">${esc(JSON.stringify(r.output, null, 2))}</pre></details>` : "";
    return `<section class="card">${list}${raw}</section>`;
  }, "No tasks yet.");
}
function routingTab(chat) {
  let prompt = "";
  const rows = [];
  for (const i of chat.items) {
    if (i.kind === "user") prompt = i.text;
    if ((i.kind === "answer" || i.kind === "preview") && i.route) {
      const r = i.route;
      rows.push(`<div class="task-label"><span class="obj" title="${esc(prompt)}">${esc(prompt.split("\n")[0])}</span>${i.kind === "preview" ? '<span class="badge">preview</span>' : ""}</div>
        <section class="card"><div class="meta" style="margin:0 0 10px">${vendorIcon(r.model_id)}<strong style="color:var(--text)">${esc(modelName(r.model_id))}</strong>
          <span class="${confClass(r.confidence)}">${Math.round(r.confidence * 100)}% confidence</span><span>${esc(shortReason(r))}</span></div>${detailsHtml(r)}</section>`);
    }
  }
  return rows.length ? rows.join("") : `<div class="empty-rows">No routing decisions yet.</div>`;
}
function settingsTab(chat) {
  const del = `<div class="row"><div class="grow"><div class="title">Delete conversation</div><div class="sub">Removes it from this device.</div></div>
      <button class="btn danger" data-set="delete">Delete</button></div>`;
  if (chatKind(chat) !== "agent") {
    return `<div class="panel"><div class="row"><div class="grow"><div class="title">Routing mode</div><div class="sub">${esc(MODES[state.mode][1])}</div></div>
        <div class="seg" data-set="mode">${Object.entries(MODES).map(([id, m]) => `<button data-v="${id}" aria-pressed="${id === state.mode}">${m[2]}</button>`).join("")}</div></div>${del}</div>`;
  }
  const accept = editMode() === "accept_edits";
  return `<div class="panel">
    <div class="row">${icon("i-folder", "agent-ic")}<div class="grow"><div class="title">Folder</div><div class="sub mono">${esc(chat.workspace || agentWorkspace() || "Not chosen")}</div></div>
      <button class="btn" data-set="folder">Change</button></div>
    <div class="row"><div class="grow"><div class="title">File edits</div><div class="sub">${accept ? "Creates and changes files in the folder without asking. Other actions still ask."
        : "Asks before writing each file."} Applies to this conversation until the app closes.</div></div>
      <div class="seg" data-set="edits"><button data-v="ask" aria-pressed="${!accept}">Ask</button><button data-v="accept_edits" aria-pressed="${accept}">Accept edits</button></div></div>
    <div class="row"><div class="grow"><div class="title">Budget per task</div><div class="sub">Estimated USD before the agent asks to spend more</div></div>
      <input class="num-input" data-set="budget" type="number" min="0.05" step="0.05" value="${esc(String(agentBudget()))}" aria-label="Agent budget in US dollars"></div>
    <div class="row">${icon("i-brain", "agent-ic")}<div class="grow"><div class="title">Memory</div><div class="sub">Notes the agent reads before planning.</div></div>
      <button class="btn" data-set="memory">Open</button></div>
    ${del}</div>`;
}
function wireSettingsTab(chat) {
  const root = $("tabpanel");
  root.querySelector('[data-set="mode"]')?.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { setMode(b.dataset.v); renderTab(chat); } });
  root.querySelector('[data-set="edits"]')?.addEventListener("click", async (e) => { const b = e.target.closest("button"); if (b) { await setEditMode(b.dataset.v); renderTab(chat); } });
  root.querySelector('[data-set="budget"]')?.addEventListener("change", (e) => { const v = parseFloat(e.target.value); if (v > 0) store.set("galliani.agent.budget", String(v)); });
  root.querySelector('[data-set="folder"]')?.addEventListener("click", (e) => { e.stopPropagation(); openFolderPicker(e.currentTarget); });
  root.querySelector('[data-set="memory"]')?.addEventListener("click", () => show("memory"));
  root.querySelector('[data-set="delete"]')?.addEventListener("click", () => { if (confirm(`Delete "${chat.title}"?`)) deleteChat(chat.id); });
}

async function agentAct(item, action, card) {
  let body = {};
  if (action === "approve-accept") { action = "approve"; body = { accept_edits: true }; setEditMode("accept_edits", { syncTask: false }); }
  if (action === "clarify") {
    const ta = card.querySelector("textarea"), answer = ta?.value.trim();
    if (!answer) return ta?.focus();
    body = { answer };
  }
  card.querySelectorAll("[data-ag], [data-head]").forEach((b) => (b.disabled = true));
  try { item.view = await api(`/api/agent/tasks/${encodeURIComponent(item.task_id)}/${action}`, body); }
  catch (e) { if (e.status === 404) item.lost = true; else alert(errText(e, "That did not work. The task will refresh.")); }
  saveChats(); refreshTaskCard(item); pollTask(item);
}

$("view").addEventListener("click", (e) => {
  const open = e.target.closest("[data-open]");
  if (open) {
    const del = e.target.closest("[data-del]");
    if (del) { e.stopPropagation(); if (confirm("Delete this conversation?")) deleteChat(del.dataset.del); return; }
    return openChat(open.dataset.open);
  }
  const go = e.target.closest("[data-go]"); if (go) return show(go.dataset.go);
  const tab = e.target.closest("[data-goto]"); if (tab) return switchTab(tab.dataset.goto);
  const fill = e.target.closest("[data-fill]"); if (fill) return fillPrompt(fill.dataset.fill);
  const copy = e.target.closest("[data-copy]"); if (copy) return copyText(copy.dataset.copy, copy);
  const more = e.target.closest("[data-more]");
  if (more) { const c = more.parentElement.querySelector("[data-clamp]"); const open = c.classList.toggle("open"); more.textContent = open ? "Show less" : "Show more"; return; }
  const b = e.target.closest("[data-ag]"); if (!b) return;
  const card = b.closest("[data-task]"); const item = card && findTaskItem(card.dataset.task); if (!item) return;
  const act = b.dataset.ag;
  if (act === "reconnect") { item.stale = false; refreshTaskCard(item); return pollTask(item); }
  if (act === "retry") return sendTask(item.objective);
  if (act === "edit") return fillPrompt(item.objective);
  if (act === "copy") return copyText(resultText(item), b);
  agentAct(item, act, card);
});
$("view").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("[data-open]")) e.target.click(); });

// ------------------------------------------------------------------ memory page (spec 010)
async function renderMemory() {
  $("view").innerHTML = `<div class="page"><div class="thinking"><span class="spin"></span>Loading…</div></div>`;
  const cfg = await loadAgentConfig();
  if (state.view !== "memory") return;
  if (!cfg.enabled) { $("view").innerHTML = `<div class="page"><h2>Memory</h2><div class="error" role="alert">${esc(cfg.reason)}</div></div>`; return; }
  let items = [], error = "";
  try { items = await api("/api/agent/memory"); } catch (e) { error = errText(e, "Memory is unavailable."); }
  if (state.view !== "memory") return;
  const scopeLabel = (s) => s === "user" ? "every task" : `folder ${folderName(s.slice(8))}`;
  const ws = agentWorkspace();
  $("view").innerHTML = `<div class="page">
    <h2>Memory</h2>
    <p class="lead">Notes Galliani keeps between agent tasks. Before planning, the agent reads the ones that apply, and it can only add a note when you approve it. Normal chats don't use memory.</p>
    ${error ? `<div class="error" role="alert">${esc(error)}</div>` : ""}
    <form class="panel mem-form" id="memForm" novalidate>
      <label class="field"><span>Remember</span>
        <textarea id="memContent" rows="2" maxlength="1000" placeholder="I prefer short bullet points in summaries"></textarea></label>
      <div class="mem-opts">
        <label class="field"><span>Kind</span><select id="memType">
          <option value="preference">Preference</option><option value="instruction">Instruction</option>
          <option value="fact">Fact</option><option value="note">Note</option></select></label>
        <label class="field"><span>Applies to</span><select id="memScope">
          <option value="user">Every task</option>
          <option value="project"${ws ? "" : " disabled"}>Only the agent folder${ws ? ` (${esc(folderName(ws))})` : ""}</option></select></label>
        <label class="check"><input type="checkbox" id="memSensitive"> Sensitive: hidden in lists, never sent to models</label>
      </div>
      <div class="form-foot"><span class="form-error" id="memError" role="alert"></span><button class="btn primary" type="submit">Save note</button></div>
    </form>
    <div class="panel" aria-label="Saved notes">${items.length ? items.map((m) => `
      <div class="row">${icon("i-brain", m.type === "preference" || m.type === "instruction" ? "agent-ic" : "")}
        <div class="grow"><div class="title">${esc(m.content)}</div>
          <div class="sub">${esc(m.type)} · ${esc(scopeLabel(m.scope))} · ${esc(m.provenance)} · ${ago(Date.parse(m.updated_at))}</div></div>
        <button class="btn danger" data-forget="${esc(m.id)}" aria-label="Forget: ${esc(m.content)}">Forget</button>
      </div>`).join("") : `<div class="row sub">Nothing saved yet.</div>`}</div>
  </div>`;
  $("memForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const content = $("memContent").value.trim();
    if (!content) { $("memError").textContent = "Write the note first."; return $("memContent").focus(); }
    try {
      await api("/api/agent/memory", { content, type: $("memType").value, scope: $("memScope").value, workspace: ws || null,
                                       sensitivity: $("memSensitive").checked ? "sensitive" : "internal" });
      renderMemory();
    } catch (err) { $("memError").textContent = errText(err, "Could not save the note."); }
  });
  $("view").querySelectorAll("[data-forget]").forEach((b) => b.addEventListener("click", async () => {
    try { await api(`/api/agent/memory/${encodeURIComponent(b.dataset.forget)}`, null, "DELETE"); renderMemory(); }
    catch (err) { alert(errText(err, "Could not forget that note.")); }
  }));
}

// ------------------------------------------------------------------ misc
function applyTheme(t) {
  store.set("galliani.theme", t === "system" ? null : t);
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = t;
}
let creditLong = "—";
async function refreshCredit() {
  const set = (short, long, low) => {
    creditLong = long; $("credit").textContent = short; $("creditBtn").title = `OpenRouter: ${long}`;
    $("creditBtn").style.color = low ? "var(--warn)" : "";
    if ($("creditLine")) $("creditLine").textContent = long;
  };
  if (!hasRouterKey()) return set("—", "no key", false);
  try {
    const b = (await api("/api/credits")).balance;
    if (b == null) return set("—", "credit unknown", false);
    const v = `${b < 0 ? "-" : ""}$${Math.abs(b).toFixed(2)}`;
    set(Math.abs(b) >= 100 ? `${b < 0 ? "-" : ""}$${Math.round(Math.abs(b))}` : v, `${v} credit`, b < 0.5);
  } catch { set("—", "credit unavailable", false); }
}
$("creditBtn").addEventListener("click", () => show("usage"));
function grow() { const t = $("prompt"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
$("prompt").addEventListener("input", grow);
$("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("sendBtn").addEventListener("click", () => send());
$("previewBtn").addEventListener("click", preview);

const narrow = () => innerWidth <= 760;
function setDrawer(open) {
  $("app").classList.toggle("drawer-open", open);
  $("drawerBtn").setAttribute("aria-pressed", String(open));
  const label = open ? "Hide conversations" : "Show conversations";
  $("drawerBtn").title = label; $("drawerBtn").setAttribute("aria-label", label);
  if (!narrow()) store.set("galliani.drawer", open ? "open" : null);
}
function closeNarrowDrawer() { if (narrow()) setDrawer(false); }
$("drawerBtn").addEventListener("click", () => setDrawer(!$("app").classList.contains("drawer-open")));
$("drawerClose").addEventListener("click", () => setDrawer(false));
document.querySelector(".main").addEventListener("pointerdown", closeNarrowDrawer);  // tap outside closes it on phones
setInterval(() => { const c = currentChat(); if (state.view === "chat" && c?.items.length) renderHead(c); }, 30000);  // keep "Started 2m ago" fresh

applyTheme(store.get("galliani.theme", "system"));
if (store.get("galliani.drawer") === "open" && !narrow()) setDrawer(true);
setMode(state.mode in MODES ? state.mode : "auto");
show("chat");
api("/api/config").then((cfg) => {
  state.config = cfg;
  $("keysWarn").hidden = hasRouterKey();
  refreshCredit();
  if (!hasRouterKey()) show("keys");
}).catch(() => {});
loadAgentConfig();
$("prompt").focus();
</script>
</body>
</html>
